<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>ACTIVE TIME REMAINING // EVA TIMER — FRONT VIEW</title>
<style>
/* ══════════════════════════════════════════════════════════════
   EVA 活动限界倒计时面板 · 样式
   ══════════════════════════════════════════════════════════════ */

/* ── 01 字体 ─────────────────────────────────────────────── */
@font-face{
  font-family:"EVA Matisse";
  src:url("./font/EVA-Matisse_Classic.ttf")format("truetype");
  font-display:block;
}

/* ── 02 重置 ─────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}

/* ── 03 设计令牌 ─────────────────────────────────────────── */
body{
  --amber:#ffac1e;
  --red:#ff2415;
  --cyan:#3fd8ff;
  --glow:0 0 9px rgba(255,150,20,.9),0 0 24px rgba(255,110,10,.55),0 0 56px rgba(255,90,0,.3);
  --seg-glow:0 0 6px rgba(255,165,35,.6),0 0 14px rgba(255,110,10,.28);
  --seg-bloom:drop-shadow(0 0 4px rgba(255,170,40,.5)) drop-shadow(0 0 12px rgba(255,110,10,.28));
  --cyan-glow:0 0 3px rgba(63,216,255,.7);
  --tick:linear-gradient(var(--cyan),var(--cyan));
  --rb:linear-gradient(180deg,#000 0 48px,transparent 48px) 0 0/1500px 600px no-repeat,
       linear-gradient(to top right,#b2403c 0,#b58a3a 20%,#a9be4a 30%,#81ba5d 38%,#55995a 64%,#3f8aa0 80%,#3f68ae 92%,#4b4fb0 100%) 200px 0/1300px 600px no-repeat;
  font-family:"EVA Matisse",serif;
  user-select:none;
}

body.danger{
  --amber:#ff2415;
  --glow:0 0 11px rgba(255,40,20,.95),0 0 33px rgba(255,20,10,.7),0 0 78px rgba(255,10,0,.4);
  --seg-glow:0 0 6px rgba(255,60,30,.65),0 0 14px rgba(255,20,10,.3);
  --seg-bloom:drop-shadow(0 0 4px rgba(255,60,30,.55)) drop-shadow(0 0 12px rgba(255,20,10,.3));
}

/* ── 04 舞台 画布 ───────────────────────────────────── */
.panel{
  position:absolute;
  left:50%;top:50%;
  width:1300px;height:600px;
  transform:translate(-50%,-50%) scale(var(--panel-scale,1));
  transform-origin:center;
  overflow:hidden;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.85));
}
.inner{position:absolute;left:-200px;top:0;width:1500px;height:600px;background:#000}

.abs{position:absolute}

/* ── 05 充能层 ───────────────────────────────────────────── */
.charge,.chargelayer{
  position:absolute;inset:0;pointer-events:none;
  mask-image:linear-gradient(to top right,#000 0 50%,transparent 52%);
  mask-repeat:no-repeat;mask-size:6000px 2400px;mask-position:-1500px 0;
  transition:mask-position .5s cubic-bezier(.35,.1,.25,1);
}
.charge{background:var(--rb)}
body.pw .charge,body.pw .chargelayer{mask-position:-1500px -1200px}

/* ── 06 左侧黑边 ─────────────────────────────────────────── */
.leftbezel{position:absolute;left:200px;top:0;width:10px;height:600px;background:#000}
.leftbar{position:absolute;left:220px;top:0;width:5px;height:600px;background:#000}

/* ── 07 装甲 SVG ─────────────────────────────────────────── */
.deco{position:absolute;inset:0;width:1500px;height:600px;overflow:visible}
.deco .blk{
  fill:#000;stroke:var(--amber);stroke-width:2;stroke-linejoin:miter;
  filter:drop-shadow(0 0 4px rgba(255,150,20,.5));
}
.deco .blk0{fill:#000;stroke:none}
body.danger .deco .blk{filter:drop-shadow(0 0 4px rgba(255,40,20,.6))}

.deco .clk{cursor:pointer;outline:none;stroke:none;filter:none}
.deco .clk:focus-visible{stroke:var(--cyan);stroke-width:2.5;filter:drop-shadow(0 0 5px rgba(63,216,255,.55))}

/* ── 08 刻度 ─────────────────────────────────────────────── */
.tk{position:absolute;pointer-events:none;filter:drop-shadow(0 0 3px rgba(63,216,255,.7))}
.tk.t1{
  left:70px;top:36px;width:1430px;height:9px;
  background:repeating-linear-gradient(90deg,var(--cyan) 0 3px,transparent 3px 12px,var(--cyan) 12px 15px,transparent 15px 100px);
}
.tk.t2{
  left:76px;top:50px;width:1424px;height:11px;filter:none;
  background:repeating-linear-gradient(90deg,#000 0 3px,transparent 3px 100px);
}
.tk.b1{
  left:0;top:490px;width:1500px;height:8px;
  background:
    var(--tick) 568px 0/3px 100% no-repeat,
    var(--tick) 629px 0/3px 100% no-repeat,
    var(--tick) 724px 0/3px 100% no-repeat,
    var(--tick) 769px 0/3px 100% no-repeat,
    var(--tick) 864px 0/3px 100% no-repeat,
    var(--tick) 909px 0/3px 100% no-repeat,
    var(--tick) 1004px 0/3px 100% no-repeat,
    var(--tick) 1049px 0/3px 100% no-repeat,
    var(--tick) 1144px 0/3px 100% no-repeat,
    var(--tick) 1199px 0/3px 100% no-repeat,
    var(--tick) 1303px 0/3px 100% no-repeat,
    var(--tick) 1398px 0/3px 100% no-repeat;
}
.tk.b2{
  left:0;top:506px;width:1500px;height:8px;
  background:
    var(--tick) 568px 0/3px 100% no-repeat,
    var(--tick) 629px 0/3px 100% no-repeat,
    var(--tick) 746.5px 0/3px 100% no-repeat,
    var(--tick) 886.5px 0/3px 100% no-repeat,
    var(--tick) 1026.5px 0/3px 100% no-repeat,
    var(--tick) 1171.5px 0/3px 100% no-repeat,
    var(--tick) 1303px 0/3px 100% no-repeat,
    var(--tick) 1398px 0/3px 100% no-repeat;
}

.cy{fill:var(--cyan)}
.cy>use{filter:drop-shadow(0 0 3px rgba(63,216,255,.7));opacity:0;transition:opacity .14s linear}
body.pw .cy>use{opacity:1;transition-delay:var(--d,0ms)}

.bk{fill:#000;filter:none}

.ye{fill:var(--amber);filter:drop-shadow(0 0 3px rgba(255,176,30,.5))}
body.danger .ye{filter:drop-shadow(0 0 3px rgba(255,40,20,.6))}

/* ── 09 分界彩条 ─────────────────────────────────────────── */
.gradbar{
  position:absolute;left:1405px;top:146.7px;width:3px;height:353.3px;z-index:6;opacity:.95;
  background:linear-gradient(180deg,#00e05a,#b8f000 28%,#ffc400 52%,#ff2020 76%,#b400ff);
  box-shadow:0 0 13px rgba(255,200,60,.45),0 0 28px rgba(180,0,255,.25);
  transition:background .4s;
}
body.danger .gradbar{
  background:linear-gradient(180deg,#7a0000,#ff2020 35%,#8a0000 65%,#ff3030);
  box-shadow:0 0 16px rgba(255,30,20,.6);
}
.gline{
  left:568px;top:500px;width:840px;height:4px;
  background:linear-gradient(90deg,#ffe600,#6fcf3a);
  box-shadow:0 0 6px rgba(255,200,40,.45);
  transition:background .4s,box-shadow .4s;
}
body.danger .gline{background:linear-gradient(90deg,#ff2a14,#ff6a2a);box-shadow:0 0 6px rgba(255,40,20,.6)}

/* ── 10 标题 ─────────────────────────────────────────────── */
.glow{color:var(--amber);text-shadow:var(--glow)}
.jpL{
  left:522px;top:123px;
  font-size:38px;font-weight:700;line-height:52px;letter-spacing:-.04em;white-space:nowrap;
  transform:scaleY(1.363);transform-origin:50% 50%;
}
.enL{
  left:752px;top:150.5px;
  font-family:Arial,"Helvetica Neue",sans-serif;
  font-size:23px;line-height:28px;letter-spacing:normal;white-space:nowrap;
}
.atoL{left:530px;top:178px;font-size:28px;line-height:38px;font-weight:700}

/* ── 11 数码管 ───────────────────────────────────────────── */
.seg-wrap{left:591px;top:185px;width:618px;height:229px}
.digit{position:absolute;overflow:visible;filter:var(--seg-bloom)}
.seg{fill:var(--amber);opacity:0}
.seg.on{opacity:1}
.dot{position:absolute;width:15px;height:13px;background:var(--amber);box-shadow:var(--seg-glow)}

body.pw:not(.clk):not(.zero) .seg-wrap.idle .cd .seg:not(.on){opacity:.07}
.seg-wrap.idle .dot{opacity:0}

body:not(.pw) .seg-wrap{visibility:hidden}

.clock-dig{position:absolute;inset:0;display:none}
body.clk .clock-dig{display:block}
body.clk .cd{display:none}

/* ── 12 右列信息框 ───────────────────────────────────────── */
.box{
  position:absolute;left:1216px;width:182px;
  border:2px solid var(--amber);background:#000;
  color:var(--amber);box-shadow:var(--glow);text-shadow:var(--glow);
}
#modeInternal{top:182px;height:84px}
#modeExternal{top:328px;height:84px}
.powerbox{top:276px;height:42px;cursor:pointer}

.mode{transition:opacity .3s,filter .3s}
.mode .jp{position:absolute;left:8px;top:0;font-size:56px;font-weight:700;line-height:62px;white-space:nowrap}
.mode .en{
  position:absolute;left:8px;bottom:0;
  font-family:Arial,"Helvetica Neue",sans-serif;
  font-size:24px;line-height:26px;
}
.mode .zebra{
  position:absolute;top:0;bottom:0;right:0;width:40px;
  background:linear-gradient(-45deg,#e8000e 0 12.5%,#150202 12.5% 25%,#e8000e 25% 37.5%,#150202 37.5% 50%,#e8000e 50% 62.5%,#150202 62.5% 75%,#e8000e 75% 87.5%,#150202 87.5%);
  transition:opacity .3s;
}
.mode:not(.active) .zebra{opacity:0}
body.roe.reserve:not(.beast) .mode.active .zebra{
  background:linear-gradient(-45deg,#eef4ff 0 12.5%,transparent 12.5% 25%,#eef4ff 25% 37.5%,transparent 37.5% 50%,#eef4ff 50% 62.5%,transparent 62.5% 75%,#eef4ff 75% 87.5%,transparent 87.5%);
}

.powerbox .jp{position:absolute;left:6px;top:1px;font-size:19px;font-weight:700;line-height:22px;white-space:nowrap}
.powerbox .en{
  position:absolute;left:6px;bottom:2px;
  font-family:Arial,sans-serif;
  font-size:10.5px;line-height:13px;white-space:nowrap;
}
.powerbox{transition:opacity .3s,filter .3s}
.powerbox.off{animation:none;opacity:.42;filter:brightness(.72)}
.powerbox:not(.off){animation:pulse 1.6s infinite}

.mode.inactive{opacity:.34;cursor:pointer}
.mode.active{cursor:pointer;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{filter:brightness(1.1)}50%{filter:brightness(1.4)}}

/* EOE：内部 / 外部 的字与字光走红色（琥珀只留在边框 + 主電源上），
   字光几何沿用 --glow 的 9/24/56px，只把颜色换红 */
body:not(.roe) .mode{
  color:var(--red);
  text-shadow:0 0 9px rgba(255,40,18,.45),0 0 24px rgba(255,20,10,.28),0 0 56px rgba(255,8,0,.14);
}

.mode.dead,.mode.dead.inactive{
  opacity:0;animation:none;filter:none;pointer-events:none;
  color:#000;text-shadow:none;border-color:transparent;box-shadow:none;
}
.mode.dead .jp,.mode.dead .en{opacity:0}
.mode.dead .zebra{opacity:0}

.sep{position:absolute;left:1216px;width:182px;height:10px}
.sep i{
  position:absolute;top:1px;width:3px;height:8px;background:var(--cyan);
  box-shadow:0 0 6px rgba(63,216,255,.5);opacity:0;transition:opacity .14s linear;
}
.sep i.l{left:0}
.sep i.r{right:0}
.sep.sm{height:6px}
.sep.sm i{height:5px;top:0}
body.pw .sep i{opacity:1;transition-delay:var(--d,0ms)}

/* ── 13 功能按钮 ─────────────────────────────────────────── */
.cell{
  position:absolute;top:428px;width:100px;height:48px;
  border:2px solid var(--amber);
  background:linear-gradient(180deg,rgba(70,25,95,.16),rgba(120,25,45,.12)),#030100;
  color:var(--amber);box-shadow:var(--glow);text-shadow:var(--glow);
  text-align:center;cursor:pointer;
}
.cell .txt{
  position:relative;z-index:2;display:block;
  font-family:Arial,"Helvetica Neue",sans-serif;
  font-size:21px;line-height:24px;
}
.cell .redbar{
  position:absolute;left:0;right:0;bottom:0;height:50%;z-index:2;
  background:linear-gradient(180deg,
    var(--red) 0 2px,transparent 2px calc(100% - 2px),var(--red) calc(100% - 2px));
  filter:drop-shadow(0 0 7px var(--red)) drop-shadow(0 0 16px rgba(255,30,15,.45));
  opacity:0;transition:opacity .16s;
}
.cell .redbar::before{
  content:"";position:absolute;left:0;right:0;top:3.5px;bottom:3.5px;
  background:var(--red);border-radius:4px;
}
.cell:hover .redbar{opacity:.22}
.cell .redbar.on{opacity:1}
.cell.gone .txt{visibility:hidden}
.cell:active{filter:brightness(1.15)}
.cell::after{
  content:"";position:absolute;left:-4px;right:-4px;top:100%;margin-top:3.5px;height:8px;
  background:
    linear-gradient(#000,#000) left 3px top 0/3px 8px no-repeat,
    linear-gradient(#000,#000) right 3px top 0/3px 8px no-repeat;
}
body:not(.pw) .cell{opacity:0;pointer-events:none}
body.pw .cell{transition:opacity .28s}

/* ── 14 红色预警框 ───────────────────────────────────────── */
.danger-cell,.subbox{
  position:absolute;top:428px;height:48px;
  border:2px solid var(--red);background:#030100;
  color:var(--red);text-align:center;
  text-shadow:0 0 11px rgba(255,40,20,.9),0 0 31px rgba(255,20,10,.6);
  box-shadow:0 0 16px rgba(255,30,15,.8),inset 0 0 22px rgba(255,40,20,.25);
}
.danger-cell{
  left:1200px;width:100px;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .3s;
}
.subbox{
  left:1312px;width:84px;
  cursor:pointer;
  box-shadow:0 0 16px rgba(255,30,15,.8),inset 0 0 20px rgba(255,30,15,.15);
}
body:not(.pw) .danger-cell,body:not(.pw) .subbox{visibility:hidden}

.danger-cell .dstk{
  width:calc(100% - 8px);
  display:flex;flex-direction:column;justify-content:center;gap:1px;
}
.danger-cell .dstk>div{
  display:flex;justify-content:space-between;white-space:nowrap;
  font-family:Arial,"Helvetica Neue",sans-serif;font-weight:700;
}
.danger-cell .dstk>div:nth-child(1){font-size:22px;line-height:22px;letter-spacing:-.058em}
.danger-cell .dstk>div:nth-child(2){font-size:15.8px;line-height:17px;letter-spacing:-.108em}
.danger-cell:not(.on){opacity:.22}
.danger-cell.on{animation:pulse .7s infinite}
body.danger .danger-cell.on{animation:dangerblink .45s steps(1) infinite}
@keyframes dangerblink{50%{opacity:.25}}

/* 文案按主题切换：EOE = 登録する / SUBSCRIBE / Code.villkiss
                   ROE = 裏コード / Mode / Change */
.subbox .tx{display:none}
body:not(.roe) .subbox .tx.e{display:block}
body.roe .subbox .tx.r{display:block}

.subbox .jp,.subbox .en1,.subbox .en2{
  width:92%;margin:0 auto;
  display:flex;justify-content:space-between;
  font-family:Arial,sans-serif;font-weight:700;
}
.subbox .e .jp{font-family:"EVA Matisse",serif;font-size:17px;line-height:20px}
.subbox .e .en1{font-size:11px;line-height:12px}
.subbox .e .en2{font-size:6px;line-height:8px}
.subbox .r .jp{font-family:"EVA Matisse",serif;font-size:17px;line-height:20px}
.subbox .r .en1,.subbox .r .en2{
  font-size:10.5px;line-height:11px;
  justify-content:center;letter-spacing:.18em;padding-left:.18em;
}

/* ── 15 状态动画 ─────────────────────────────────────────── */
body.zero:not(.clk) .jpL,
body.zero:not(.clk) .enL,
body.zero:not(.clk) .atoL,
body.zero:not(.clk) .danger-cell,
body.danger.zero:not(.clk) .danger-cell.on{animation:zeroA .39s steps(1) infinite}
@keyframes zeroA{0%{opacity:1}20%{opacity:1}20.01%{opacity:.1}100%{opacity:.1}}

body.zero:not(.clk) .mode.active .zebra,
body.zero:not(.clk) .cell .redbar.on{animation:zeroB .25s steps(1) infinite}
@keyframes zeroB{0%,100%{opacity:1}50%{opacity:.08}}

/* 归零时「内部 / 外部」的字光收一档（两个主题按同一比例收，
   否则同一块按钮在 EOE / ROE 下亮度对不上） */
body:not(.roe).zero:not(.clk) .mode{
  color:var(--red);
  text-shadow:0 0 8px rgba(255,40,18,.58),0 0 20px rgba(255,20,10,.3),0 0 42px rgba(255,8,0,.14);
}

body.zero:not(.clk) .subbox{opacity:0 !important;visibility:hidden;}

#modeExternal.resv .zebra{animation:resvBlink .25s steps(1) infinite}
@keyframes resvBlink{0%,100%{opacity:1}50%{opacity:.12}}

body.reserve .seg-wrap{animation:resvFade 3s ease-in-out infinite}
@keyframes resvFade{0%,22%{opacity:1}70%{opacity:0}78%{opacity:0}82%,100%{opacity:1}}

.vswap{animation:vswap .24s ease-out both}
@keyframes vswap{from{opacity:0}to{opacity:1}}

/* ── 16 辅助 ─────────────────────────────────────────────── */
.hint{
  position:fixed;left:0;right:0;bottom:6px;z-index:40;
  pointer-events:none;text-align:center;
  font-family:"Microsoft YaHei",sans-serif;font-size:12px;letter-spacing:.14em;
  color:var(--amber);opacity:.45;text-shadow:0 0 8px rgba(255,150,20,.4);
}
.box:focus-visible,.cell:focus-visible{outline:2px solid currentColor;outline-offset:4px}

/* ══════════════════════════════════════════════════════════════
   17 ROE 配色（body.roe）
   ══════════════════════════════════════════════════════════════ */
body{
  --rb2:linear-gradient(180deg,#03031a 0 48px,transparent 48px) 0 0/1500px 600px no-repeat,
        linear-gradient(to top right,#f58a55 0,#f0687a 14%,#e2509e 30%,#c850d8 46%,#9a48e0 62%,#6240e4 78%,#3d3bd6 90%,#2c2aa8 100%) 200px 0/1300px 600px no-repeat;
}

.charge.alt{background:var(--rb2);opacity:0;transition:mask-position .5s cubic-bezier(.35,.1,.25,1),opacity .45s ease}
body.roe .charge.alt{opacity:1}
.leftbezel,.leftbar,.inner{transition:background-color .45s}
body.roe .inner,body.roe .leftbezel,body.roe .leftbar{background:#03031a}

.plate{position:absolute;inset:0;width:1500px;height:600px;overflow:visible;pointer-events:none;opacity:0;transition:opacity .45s ease}
body.roe .plate{opacity:1}

.baseShade{opacity:0;pointer-events:none;transition:opacity .45s ease}
body.roe .baseShade{opacity:1}
body.roe.beast .baseShade line{stroke:rgba(255,120,130,.28)}
/* 獣化：补缝也要从「亮红侧壁」过渡到「暗红底板」，否则拐角处又是硬切 */
body.roe.beast #gSeamX .s0{stop-color:#6a0f1e}
body.roe.beast #gSeamX .s1{stop-color:#3a0612}
body.roe.beast #gSeamX .s2{stop-color:#16030a}

/* 右下底板右侧的落影/侧壁：只在 ROE 显形，配色跟着装甲板走 */
.blk0Cast{opacity:0;pointer-events:none;transition:opacity .45s ease}
body.roe .blk0Cast{opacity:1}
body.roe.beast .blk0Cast .b0s {fill:#3a0610}
body.roe.beast .blk0Cast .b0w {fill:#3a0612}
body.roe.beast .blk0Cast .b0w2{fill:#6a0f1e}

.deco .themeHot{cursor:pointer;outline:none}
.deco .themeHot:hover{stroke:#ffe8b4;filter:drop-shadow(0 0 8px rgba(255,190,70,.95))}
.deco .themeHot:focus-visible{stroke:var(--cyan);stroke-width:2.5;filter:drop-shadow(0 0 5px rgba(63,216,255,.55))}
.themeTag{
  position:absolute;left:324px;top:545px;width:84px;height:30px;z-index:30;
  transform:rotate(18deg);text-align:center;pointer-events:none;
  font:700 24px/30px Arial,"Helvetica Neue",sans-serif;letter-spacing:.12em;
  color:var(--amber);text-shadow:var(--glow);
  opacity:0;transition:opacity .15s;
}
.themeTag.show{opacity:1}
body.roe .themeTag{color:#fff;text-shadow:0 2px 5px rgba(10,10,70,.5)}

.deco .blk{transition:fill .45s,stroke .45s}
body.roe .deco .blk{fill:rgba(0,0,0,0);stroke:rgba(0,0,0,0);filter:none}
body.roe .deco .blk0{fill:#0a0a34}
body.roe .deco .themeHot:hover{fill:rgba(150,160,255,.10)}
body.roe .deco .themeHot:focus-visible{stroke:#a8c0ff;stroke-width:2.5}

body.roe{
  --cyan:#e2e9ff;
  --tkC:#e2e9ff;
  --tkG:drop-shadow(0 0 3px rgba(170,195,255,.85)); 
}
body.roe .tk{filter:var(--tkG)}
body.roe:not(.beast) .tk.t2{
  background:repeating-linear-gradient(90deg,var(--tkC) 0 3px,transparent 3px 100px);
  filter:var(--tkG);
}
body.roe .tk.t1{
  background:repeating-linear-gradient(90deg,var(--tkC) 0 3px,transparent 3px 12px,var(--tkC) 12px 15px,transparent 15px 100px);
}
body.roe .tk.b1,body.roe .tk.b2{--tick:linear-gradient(var(--tkC),var(--tkC))}
body.roe .cy>use{filter:var(--tkG)}
body.roe .ye{fill:#8fa9ff;filter:var(--tkG)}
body.roe:not(.beast) .bk,
body.roe:not(.beast) #barH{fill:var(--tkC);filter:var(--tkG)}
body.roe:not(.beast) .cut{stroke:var(--tkC);filter:var(--tkG)}
/* 断电时不亮：衬底刻度(.bk) 与斜槽那 4 根短切线(.cut) 在 EOE 里本来是黑的（等于看不见），
   ROE 不能因为改了配色就把它们点亮 —— 跟着 .pw 走，通电后才有 */
body.roe:not(.pw) .bk,
body.roe:not(.pw) .cut{opacity:0}
body.roe:not(.beast) .cell::after{
  background:
    linear-gradient(var(--tkC),var(--tkC)) left 3px top 0/3px 8px no-repeat,
    linear-gradient(var(--tkC),var(--tkC)) right 3px top 0/3px 8px no-repeat;
  filter:var(--tkG);
}
body.roe .sep i{background:#ff8d9c;box-shadow:0 0 6px rgba(255,100,130,.65)}

body.roe .gradbar{left:1405px;background:linear-gradient(180deg,#7df0ff,#2ab0ec 55%,#2f6fe6);box-shadow:0 0 10px rgba(60,200,255,.65),0 0 24px rgba(40,140,255,.35)}
body.roe .gline{width:840px;background:linear-gradient(90deg,#ff7ccf,#b17cff 60%,#7a8cff);box-shadow:0 0 7px rgba(200,120,255,.55)}
body.roe.danger .gradbar{background:linear-gradient(180deg,#ff9aa5,#ff2a40 50%,#a00018);box-shadow:0 0 14px rgba(255,40,60,.7)}
body.roe.danger .gline{background:linear-gradient(90deg,#ff2a40,#ff7a6a);box-shadow:0 0 7px rgba(255,40,60,.65)}

.glow{transition:color .35s}
body.roe .jpL,body.roe .atoL{color:#f4f6ff;text-shadow:0 0 6px rgba(170,195,255,.6),2px 3px 1px rgba(0,0,0,.95)}
body.roe .enL{color:#dde3f7;text-shadow:none}


body.roe{
  --seg-glow:0 0 7px rgba(190,212,255,.75),2px 3px 0 rgba(8,0,30,.75);
  --seg-bloom:drop-shadow(2px 3px 1px rgba(8,0,30,.72)) drop-shadow(0 0 5px rgba(190,212,255,.5)) drop-shadow(0 0 16px rgba(120,150,255,.3));
}
body.roe .seg{fill:url(#gSegW);stroke:rgba(255,255,255,.45);stroke-width:.6;stroke-linejoin:round}
body.roe .dot{background:#f4f7ff}
body.roe .seg-wrap.live .digit.cd{--seg-bloom:drop-shadow(2px 3px 1px rgba(8,0,30,.72)) drop-shadow(0 0 5px rgba(255,30,60,.55)) drop-shadow(0 0 16px rgba(255,10,40,.3))}
body.roe.danger .seg-wrap.live .digit.cd{--seg-bloom:drop-shadow(2px 3px 1px rgba(8,0,30,.72)) drop-shadow(0 0 6px rgba(255,40,60,.85)) drop-shadow(0 0 22px rgba(255,10,40,.5))}
body.roe .seg-wrap.live .dot.cd{--seg-glow:0 0 7px rgba(255,35,65,.75),2px 3px 0 rgba(8,0,30,.75)}
body.roe .seg-wrap.live .cd .seg{fill:url(#gSegR);stroke:rgba(255,150,170,.32)}
body.roe .seg-wrap.live .dot.cd{background:#ff1e3a}
body.roe.zero:not(.clk) .jpL,
body.roe.zero:not(.clk) .enL,
body.roe.zero:not(.clk) .atoL{animation:none}
body.roe.zero:not(.clk) .seg-wrap{animation:zeroA .39s steps(1) infinite}

body.roe{
  --glassB:rgba(116,152,228,.84);
  --glassV:rgba(124,104,208,.46);
  --glassG:rgba(132,148,180,.55);
  --rimB:rgba(214,228,255,.4);
  --rimW:rgba(255,255,255,.26);
}
body.roe .box,body.roe .cell,body.roe .danger-cell,body.roe .subbox{
  isolation:isolate;border-style:solid;border-width:2px;border-radius:3px;text-shadow:none;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}

/* ── 立体系统：单一光源（左上）· 统一厚度 ─────────────────
   · 抬起 = 一道硬侧壁当厚度 + 接触投影 + 环境遮蔽
   · 「内部 / 外部」= 选中的抬、另一块平贴
   · 「主電源」= 通电(:not(.off))抬；断电(.off) 平贴
   · 「DANGER」= 内部 + 倒计时（.on）抬；外部 / 予備 平贴；
                 告急时继续抬着闪底；獣化时抬 + 抖 + 消失/出现
   · 「裏コード」= 獣化激活时才抬起并转红，平时平贴
   ──────────────────────────────────────────────────────────── */
body.roe{
  --wallUp:2px 3px 0 0 rgba(62,86,158,1),
           3px 5px 0 -1px rgba(14,20,58,.95),
           5px 10px 16px -3px rgba(0,0,16,.8),
           8px 22px 30px -14px rgba(0,0,10,.55);
}
body.roe .box{
  border-color:rgba(166,190,244,.36);
  background:linear-gradient(180deg,rgba(128,160,230,.5),rgba(78,102,178,.58));
  color:#cfe0ff;
  box-shadow:none;
  text-shadow:0 0 9px rgba(150,182,250,.62),0 0 24px rgba(96,132,235,.38),0 0 56px rgba(70,105,225,.18);
  transition:transform .26s cubic-bezier(.2,1.45,.4,1),box-shadow .26s,
             color .3s,opacity .3s,filter .3s,background .3s,border-color .3s;
}

/* 未按下 = 一块浅蓝玻璃压在甲板上：底色浅、边框也是浅蓝，
   不造厚度、不描黑边，仍能和背后甲板分开 */
body.roe .mode,
body.roe .powerbox,
body.roe .danger-cell,
body.roe .subbox{
  --wall:0 0 0 0 rgba(0,0,0,0);
  transform:none;
  border-color:rgba(166,190,244,.36);
  box-shadow:var(--wall);
}

/* 抬起：生效的档位 / 通电的主電源 / 激活的裏コード
   —— 一道硬侧壁当厚度，其余柔化 */
body.roe .mode.active,
body.roe .powerbox:not(.off),
body.roe.beast .subbox{
  --wall:var(--wallUp);
  transform:translate(-1px,-3px);
  border-color:rgba(198,218,255,.46);
  box-shadow:var(--wall);
}

body.roe.beast .danger-cell{
  --wall:var(--wallUp);
  transform:translate(-1px,-3px);
  border-color:rgba(198,218,255,.46);
  box-shadow:var(--wall);
}

/* DANGER 开关的开机瞬闪：抬起 → 落回 → 最后 7 秒再进警戒
   · 内部倒计时一开始（乱码之后）抬起 + 点亮 0.4s（.boot）
   · 0.4s 后侧壁收掉、整块落回甲板、文字熄灭，一直保持「按下」相
   · 剩 7 秒（body.danger）才回到原来的「抬着闪底」
   ★ .on 本身不再抬起：抬起只由 .boot / .danger / .beast / .zero 决定 */
body.roe .danger-cell.on{
  --wall:0 0 0 0 rgba(0,0,0,0);
  transform:none;
  border-color:rgba(166,190,244,.36);
  box-shadow:var(--wall);
  transition:transform .26s cubic-bezier(.55,0,.85,.3),box-shadow .26s,
             border-color .26s,color .18s;
}
body.roe .danger-cell.boot{
  /* 红板就得配红壁，蓝壁会露馅（和告急态同一套厚度） */
  --wall:2px 3px 0 0 rgba(88,10,26,.98),
         3px 5px 0 -1px rgba(28,2,10,.95),
         6px 12px 18px -4px rgba(14,0,6,.8),
         9px 24px 32px -16px rgba(10,0,4,.5);
  transform:translate(-1px,-3px);
  border-color:rgba(255,120,135,.62);
  box-shadow:var(--wall);
  color:#ff3a4c;
  text-shadow:0 0 10px rgba(255,40,60,.9);
  transition:transform .18s cubic-bezier(.2,1.5,.4,1),box-shadow .18s,
             border-color .18s,color .18s;
}
body.roe .danger-cell.boot::before{
  border-color:rgba(255,120,135,.62);
  background:linear-gradient(180deg,#8a0f1e,#440512);
  box-shadow:var(--wall),0 0 16px rgba(255,30,50,.5);
  /* 点亮要「啪」地一下（0.4s 窗口里没时间让它慢慢染红），回落仍走 .3s 渐变 */
  transition:background .1s linear,border-color .1s linear,box-shadow .18s;
}
body.roe .danger-cell.boot .dstk{opacity:1}
body.roe .mode.active,
body.roe .powerbox:not(.off){
  background:linear-gradient(168deg,rgba(150,180,242,.92),rgba(108,142,216,.92));
}
body.roe .powerbox:not(.off) .jp,
body.roe .powerbox:not(.off) .en{opacity:.96}

/* 按下去：厚度整套收掉，整块落回甲板 */
body.roe .mode.active:active,
body.roe .powerbox:active,
body.roe.beast .subbox:active{
  --wall:0 0 0 0 rgba(0,0,0,0);
  transform:translate(1px,1px);
  transition-duration:.07s;
  box-shadow:var(--wall);
}

/* 文字发光*/
body.roe .mode.active{
  color:#e8102c;
  text-shadow:0 0 9px rgba(255,40,60,.45),0 0 24px rgba(255,24,44,.28),0 0 56px rgba(255,10,32,.14);
}

/* 予備 / 外部 是同一块按钮（文案随状态切换）：ROE 下激活时走白字白光，
   红色只留给「内部」和告急系统；獣化那套红字不动（:not(.beast)）。
   用 ID 提权，才能压过上面那条 .mode.active 的红字与下面各条的整组改写 */
body.roe:not(.beast) #modeExternal.active{
  color:#f4f8ff;
  text-shadow:0 0 9px rgba(232,242,255,.66),0 0 24px rgba(184,208,255,.42),0 0 56px rgba(142,176,255,.22);
}
body.roe.zero:not(.clk):not(.beast) #modeExternal.active{
  text-shadow:0 0 7px rgba(232,242,255,.5),0 0 18px rgba(184,208,255,.28);
}
body.roe .mode.inactive{
  opacity:1;color:#b3c9f0;
  text-shadow:0 0 9px rgba(150,182,250,.31),0 0 24px rgba(96,132,235,.19),0 0 56px rgba(70,105,225,.1);
  background:linear-gradient(180deg,rgba(150,178,235,.8),rgba(104,128,200,.86));
}
/* 归零：字光同样收一档（与 EOE 的 zero 规则同比例） */
body.roe.zero:not(.clk) .mode.active{
  text-shadow:0 0 7px rgba(255,40,60,.6),0 0 18px rgba(255,24,44,.3),0 0 38px rgba(255,10,32,.12);
}
body.roe.zero:not(.clk) .mode.inactive{
  text-shadow:0 0 7px rgba(150,182,250,.22),0 0 18px rgba(96,132,235,.12);
}
body.roe .mode .zebra{
  transition:opacity .3s;
  background:linear-gradient(-45deg,#e6122e 0 12.5%,transparent 12.5% 25%,#e6122e 25% 37.5%,transparent 37.5% 50%,#e6122e 50% 62.5%,transparent 62.5% 75%,#e6122e 75% 87.5%,transparent 87.5%);
}
body.roe .mode.inactive .zebra{opacity:0}
body.roe .mode.dead{
  opacity:0;animation:none;filter:none;pointer-events:none;transform:none;
  --wall:0 0 0 0 rgba(0,0,0,0);
  box-shadow:none;border-color:transparent;background:none;text-shadow:none;
}
body.roe .mode.dead .zebra{opacity:0}

body.roe .cell{
  border-color:var(--rimW);background:var(--glassV);color:#d2f1ff;
  box-shadow:none;
  transition:opacity .28s,color .2s,filter .15s;
}
body.roe .cell:hover{filter:brightness(1.1)}
body.roe .cell .txt{transition:color .2s}
body.roe .cell.sel .txt{color:#ff2a42}

/* DANGER：抬起与否只由 .on / .beast 决定（见上面的厚度规则），这里只管材质：
   · 常态（内部倒计时、告急）→ 只闪底色，不闪文字，厚度一直在，不压回去
   · 裏コード 模式 → 抬起 + 整块警报闪（dAlert，节奏取自参考 GIF）

   ★ 材质整体挂在 ::before 这块「底板」上，元素本身只留排版 + 抖动：
     底板可以整块闪没，文字 .dstk 压在底板之上（z-index 1），永不跟着消失。 */
body.roe .danger-cell{
  background:none!important;
  border-color:transparent!important;
  box-shadow:none!important;
  color:#dbe6f8;
  text-shadow:0 0 9px rgba(214,228,255,.45),0 0 24px rgba(150,172,232,.24),0 0 56px rgba(120,150,230,.12);
  -webkit-backdrop-filter:none;backdrop-filter:none;
  transition:transform .26s cubic-bezier(.2,1.45,.4,1),color .3s;
}
/* 底板：inset:-2px 正好补回被让出来的 2px 边框，尺寸与原按钮一致 */
body.roe .danger-cell::before{
  content:"";position:absolute;inset:-2px;z-index:0;
  border:2px solid rgba(166,190,244,.36);border-radius:inherit;
  background:linear-gradient(180deg,rgba(146,174,232,.76),rgba(100,124,194,.84));
  box-shadow:var(--wall);
  pointer-events:none;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  transition:background .3s,border-color .3s,box-shadow .26s,opacity .2s;
}
body.roe .danger-cell:not(.on){opacity:1}
body.roe .danger-cell .dstk{position:relative;z-index:1;opacity:0;transition:opacity .2s}
body.roe:not(.danger):not(.beast) .danger-cell.on{animation:none}

body.roe.beast .danger-cell,
body.roe.danger .danger-cell.on{
  color:#ff3a4c;text-shadow:0 0 10px rgba(255,40,60,.9);
}
body.roe.beast .danger-cell::before,
body.roe.danger .danger-cell.on::before{
  border-color:rgba(255,120,135,.62);
  background:linear-gradient(180deg,#3b0712,#1d0309);
  animation:dPulse .45s steps(1) infinite;
}
/* 告急态：厚度也换成暗红，红板红壁才是一整块（蓝壁会露馅） */
body.roe.danger .danger-cell.on{
  transform:translate(-1px,-3px);   /* 抬起改由这里与 .boot 负责，.on 本身是平贴的 */
  --wall:2px 3px 0 0 rgba(88,10,26,.98),
         3px 5px 0 -1px rgba(28,2,10,.95),
         6px 12px 18px -4px rgba(14,0,6,.8),
         9px 24px 32px -16px rgba(10,0,4,.5);
}
/* 裏コード：整块 dAlert 警报闪（替代原来的 dJit + dHide + dPulse 三频叠加）
   （.on 那一条选择器必须写上，否则会被上面 .danger .danger-cell.on 压过去）
   ★ 文字与底板一起压暗到 .43，不会整块消失 */
body.roe.beast .danger-cell,
body.roe.beast .danger-cell.on{
  --wall:2px 3px 0 0 rgba(96,10,26,.98),
         3px 5px 0 -1px rgba(34,2,10,.95),
         6px 12px 18px -4px rgba(14,0,6,.8),
         9px 24px 32px -16px rgba(10,0,4,.5);
  box-shadow:var(--wall);
  animation:dAlert .88s steps(1,end) infinite;   /* 整块（底板 + 文字）一起按 GIF 节奏闪 */
  --gOn:0 0 10px rgba(255,40,60,.95),0 0 26px rgba(255,20,45,.65),0 0 56px rgba(255,10,32,.35);
  --gMid:0 0 8px rgba(255,40,60,.6),0 0 20px rgba(255,20,45,.35);
  --gOff:0 0 5px rgba(255,40,60,.3);
}
body.roe.beast .danger-cell::before{
  /* 底板常亮红，不再自己闪/消失；明暗统一交给元素本体的 dAlert */
  animation:none;
  background:linear-gradient(180deg,#8a0f1e,#440512);
  border-color:rgba(255,140,152,.72);
  box-shadow:var(--wall),0 0 16px rgba(255,30,50,.5);
}
body.roe.beast .danger-cell .dstk,
body.roe.danger .danger-cell .dstk{opacity:1}

/* 归零：底板跟着方波一起闪文字由第 15 章那条 zeroA 负责 */
body.roe.zero:not(.clk) .danger-cell::before{animation:zeroA .39s steps(1) infinite}
/* 归零是断电前最后一相，保持原来「抬着闪」的样子 */
body.roe.zero:not(.clk) .danger-cell.on{
  --wall:var(--wallUp);
  transform:translate(-1px,-3px);
  box-shadow:var(--wall);
}

@keyframes dPulse{
  0%,49.9%{
    background:linear-gradient(180deg,#8a0f1e,#440512);
    border-color:rgba(255,140,152,.72);
    box-shadow:var(--wall),0 0 16px rgba(255,30,50,.5);
  }
  50%,100%{
    background:linear-gradient(180deg,#25040c,#0b0104);
    border-color:rgba(255,120,135,.22);
    box-shadow:var(--wall);
  }
}
/* 獣化 DANGER 警报闪（逐帧实测 GIF：21 帧 / 880ms 一轮，无缝循环）
   · 常亮 560ms → 抽搐段 320ms → 回常亮
   · 抽搐段：半暗(40) 亮(40) 灭(80) 亮(40) 灭(40) 亮(40) 半暗(40)——不是等长的 on/off
   · 「灭」不是全黑：整块（底板+文字）压到约 .43，暗红底光仍在
   · 发光一直是红色，没有泛白；抽搐段带 1~2px 抖动，常亮段静止
   · steps(1,end)：每个关键帧保持到下一个关键帧，等价于 GIF 的逐帧跳变 */
@keyframes dAlert{
  0%     {opacity:.68;--dGlow:var(--gMid);transform:translate(0,-4px)}
  4.55%  {opacity:.92;--dGlow:var(--gOn); transform:translate(-2px,-2px)}
  9.09%  {opacity:.43;--dGlow:var(--gOff);transform:translate(0,-4px)}
  18.18% {opacity:.92;--dGlow:var(--gOn); transform:translate(-2px,-2px)}
  22.73% {opacity:.43;--dGlow:var(--gOff);transform:translate(0,-4px)}
  27.27% {opacity:1;  --dGlow:var(--gOn); transform:translate(-1px,-3px)}
  31.82% {opacity:.8; --dGlow:var(--gMid);transform:translate(-1px,-3px)}
  36.36%,100%{opacity:1;--dGlow:var(--gOn);transform:translate(-1px,-3px)}
}

/* 裏コード：未激活时与 DANGER 同材质同底色（都平贴），
   只有獣化被打开后才抬起并转成红色 */
body.roe .subbox{
  background:linear-gradient(180deg,rgba(146,174,232,.76),rgba(100,124,194,.84));
  color:#dbe6f8;
  text-shadow:0 0 9px rgba(214,228,255,.45),0 0 24px rgba(150,172,232,.24),0 0 56px rgba(120,150,230,.12);
  -webkit-backdrop-filter:none;backdrop-filter:none;
  transition:filter .2s,transform .26s cubic-bezier(.2,1.45,.4,1),
             box-shadow .26s,background .3s,color .3s,border-color .3s,text-shadow .3s;
}
body.roe.beast .subbox{

  --wall:2px 3px 0 0 rgba(96,10,26,.98),
         3px 5px 0 -1px rgba(34,2,10,.95),
         6px 12px 18px -4px rgba(14,0,6,.8),
         9px 24px 32px -16px rgba(10,0,4,.5);
  transform:translate(-1px,-3px);
  background:linear-gradient(180deg,#8a0f1e,#440512);
  border-color:rgba(255,140,152,.72);
  color:#ff3a4c;
  text-shadow:0 0 10px rgba(255,40,60,.9);
  box-shadow:var(--wall),0 0 16px rgba(255,30,50,.5);
}
body.roe .subbox:hover{filter:brightness(1.1)}
body.roe .hint{color:#aab9ff;text-shadow:0 0 8px rgba(120,150,255,.5)}

/* ══════════════════════════════════════════════════════════════
   19 獣化 The Beast（body.roe.beast）
   ══════════════════════════════════════════════════════════════ */
body{
  --rb3:linear-gradient(180deg,#0a0206 0 48px,transparent 48px) 0 0/1500px 600px no-repeat,
        linear-gradient(to top right,#ff3a2a 0,#ff1c28 30%,#f01430 50%,#c80c28 68%,#7c0818 85%,#3c0310 100%) 200px 0/1300px 600px no-repeat;
}
.charge.red{background:var(--rb3);opacity:0;transition:mask-position .5s cubic-bezier(.35,.1,.25,1),opacity .35s ease}
body.beast .charge.red{opacity:1}
.fx{position:absolute;inset:0;width:1500px;height:600px;pointer-events:none;opacity:0;transition:opacity .2s}
body.beast .fx{opacity:1}
.fx-fixed{position:absolute;inset:0;width:1500px;height:600px;pointer-events:none;opacity:0;transition:opacity .2s}
body.beast .fx-fixed{opacity:1}
.pShadow,.pWall,.pWall2{transition:fill .35s}

body.roe.beast{
  --cyan:#ffd6da;
  --tkC:var(--cyan);
  --tkG:drop-shadow(0 0 3px rgba(255,130,140,.85));
  --glassB:rgba(170,20,36,.72);
  --glassV:rgba(150,16,34,.5);
  --glassG:rgba(120,14,28,.45);
  --rimB:rgba(255,140,150,.4);
  --rimW:rgba(255,120,130,.3);
  --seg-glow:0 0 7px rgba(255,35,65,.7),2px 3px 0 rgba(40,0,10,.6);
  --seg-bloom:drop-shadow(2px 3px 1px rgba(40,0,10,.6)) drop-shadow(0 0 5px rgba(255,40,70,.55)) drop-shadow(0 0 14px rgba(255,10,40,.28));
}
body.roe.beast .inner,body.roe.beast .leftbezel,body.roe.beast .leftbar{background:#0b0207}
body.roe.beast #gPanel stop:nth-child(1){stop-color:#2a0a12}
body.roe.beast #gPanel stop:nth-child(2){stop-color:#34101a}
body.roe.beast #gPanel stop:nth-child(3){stop-color:#4e1222}
body.roe.beast .pShadow{fill:#3a0610}
body.roe.beast .pWall{fill:#3a0612}
body.roe.beast .pWall2{fill:#6a0f1e}

body.roe.beast .ye{fill:#000;filter:none}
/* 只有 DANGER / 裏コード 那一行的四根（x 1303/1307/1398/1402）留在红：
   .ye 整组转黑后它们正好落在红灯带旁边，跟着一起黑会断成一截。
   颜色跟 .bk / .cy 同一支 #ff8a96，光晕也同一副 */
body.roe.beast .ye>.yHot{fill:#ff8a96;filter:drop-shadow(0 0 3px rgba(255,120,130,.85))}
body.roe.beast .bk{fill:#ff8a96;filter:drop-shadow(0 0 3px rgba(255,120,130,.8))}
body.roe.beast .cell::after{background:linear-gradient(#ff8a96,#ff8a96) left 3px top 0/3px 8px no-repeat,linear-gradient(#ff8a96,#ff8a96) right 3px top 0/3px 8px no-repeat;filter:drop-shadow(0 0 3px rgba(255,120,130,.8))}

/* 獣化：所有文字红色 */
body.roe.beast .jpL,
body.roe.beast .enL,
body.roe.beast .atoL,
body.roe.beast .mode .jp,
body.roe.beast .mode .en,
body.roe.beast .powerbox .jp,
body.roe.beast .powerbox .en,
body.roe.beast .cell .txt,
body.roe.beast .danger-cell .dstk,
body.roe.beast .subbox .jp,
body.roe.beast .subbox .en1,
body.roe.beast .subbox .en2{
  color:#ff3a4c !important;
  text-shadow:0 0 8px rgba(255,30,50,.75) !important;
}
/* 獣化下标题的投影同样是黑色，只让发光层转红（黑投影必须写在最前，否则被红晕糊成红色） */
body.roe.beast .jpL,
body.roe.beast .enL,
body.roe.beast .atoL{
  text-shadow:2px 3px 1px rgba(0,0,0,.98),0 0 8px rgba(255,30,50,.55),0 0 22px rgba(255,20,40,.22) !important;
}
body.roe.beast:not(.zero) :is(.jpL,.enL,.atoL)>span{
  display:inline-block;
  animation:chJitA var(--jd,2.2s) steps(1,end) infinite;
  animation-delay:var(--td,0s);
}
body.roe.beast:not(.zero) :is(.jpL,.enL,.atoL)>span.j2{animation-name:chJitB}
body.roe.beast:not(.zero) :is(.jpL,.enL,.atoL)>span.j3{animation-name:chJitC}
body.roe.beast:not(.zero) :is(.jpL,.enL,.atoL)>span.dim{
  animation:chFade 1.3s ease-in-out 1 both;
}
@keyframes chJitA{
  0%,100%{translate:0 0}
  11%{translate:.5px -.35px}
  23%{translate:-.6px .3px}
  34%{translate:.4px .5px}
  46%{translate:-.45px -.5px}
  58%{translate:.6px .2px}
  71%{translate:-.5px .4px}
  83%{translate:.3px -.4px}
}
@keyframes chJitB{
  0%,100%{translate:0 0}
  9%{translate:0 -.7px}
  18%{translate:0 .3px}
  29%{translate:-.35px -.6px}
  41%{translate:0 .5px}
  53%{translate:.3px 0}
  64%{translate:0 -.75px}
  76%{translate:-.3px .4px}
  88%{translate:0 .3px}
}
@keyframes chJitC{
  0%,100%{translate:0 0}
  14%{translate:.7px .3px}
  26%{translate:.2px -.3px}
  38%{translate:-.65px .45px}
  47%{translate:.55px .5px}
  62%{translate:-.5px -.4px}
  74%{translate:.6px -.2px}
  86%{translate:-.25px .3px}
}
@keyframes chFade{
  0%{-webkit-text-fill-color:#ff3a4c;filter:drop-shadow(0 0 0 rgba(255,240,244,0));translate:0 0}
  34%{-webkit-text-fill-color:#ffa0ae;filter:drop-shadow(0 0 3px rgba(255,210,220,.6));translate:.8px -.9px}
  66%{-webkit-text-fill-color:#ff5f70;filter:drop-shadow(0 0 2px rgba(255,150,165,.4));translate:-.7px .6px}
  100%{-webkit-text-fill-color:#ff3a4c;filter:drop-shadow(0 0 0 rgba(255,240,244,0));translate:0 0}
}

/* 数码管：全红 + 轻微抖动 */
body.roe.beast .seg{fill:url(#gSegR);stroke:rgba(255,150,170,.32)}
body.roe.beast .dot{background:#ff1e3a}
body.roe.beast.pw:not(.clk):not(.zero) .seg-wrap .cd .seg:not(.on),
body.roe.beast .seg:not(.on){opacity:.2}
body.roe.beast .seg-wrap .digit .seg.hl{fill:rgba(255,40,60,.07);stroke:#ffd2d8;stroke-width:1.6;filter:none}
body.roe.beast .seg-wrap{animation:segJitter .18s steps(2) infinite}
@keyframes segJitter{
  0%{transform:translate(0,0)}
  25%{transform:translate(1px,0)}
  50%{transform:translate(-1px,1px)}
  75%{transform:translate(0,-1px)}
  100%{transform:translate(1px,0)}
}

body.roe.beast .box{
  color:#ff6a76;
  text-shadow:0 0 9px rgba(255,90,110,.62),0 0 24px rgba(255,50,70,.38),0 0 56px rgba(255,30,50,.18);
}
/* 獣化下抬起的那块，侧壁换成暗红，几何关系不变 */
body.roe.beast .mode.active,body.roe.beast .powerbox:not(.off){
  --wall:2px 3px 0 0 rgba(64,6,18,.95),
         3px 5px 0 -1px rgba(38,2,10,.92),
         5px 10px 16px -3px rgba(24,0,8,.75),
         8px 22px 30px -14px rgba(14,0,5,.55);
  border-color:rgba(255,180,190,.5);
  background:linear-gradient(168deg,rgba(255,86,98,.9),rgba(198,22,40,.9));
  box-shadow:var(--wall);
}
body.roe.beast .mode.active{color:#ff7580;animation:none}
body.roe.beast .powerbox:not(.off){color:#ff9aa4;animation:none}
/* 未点的那一块也要读作红色：底色转红、边框转红，而不是只剩字是红的 */
body.roe.beast .mode.inactive{
  color:#ff8b96;
  background:linear-gradient(180deg,rgba(210,44,64,.55),rgba(132,18,38,.62));
  border-color:rgba(255,130,142,.34);
  text-shadow:0 0 9px rgba(255,70,90,.5),0 0 24px rgba(255,30,50,.28),0 0 56px rgba(255,10,30,.14);
}
/* 獣化下斜纹跟字同色：文字被第 19 章钉成 #ff3a4c，斜纹也必须用这个红，
   否则 #ff6a76 压在亮红玻璃底上会读成白色（与「内部/外部」明显不是一色） */
body.roe.beast .mode .zebra{
  background:linear-gradient(-45deg,#ff3a4c 0 12.5%,transparent 12.5% 25%,#ff3a4c 25% 37.5%,transparent 37.5% 50%,#ff3a4c 50% 62.5%,transparent 62.5% 75%,#ff3a4c 75% 87.5%,transparent 87.5%);
}

/* 内外部文字不闪烁 */
body.roe.beast .mode.inactive .jp,
body.roe.beast .mode.inactive .en{
  animation:none !important;
  opacity:1 !important;
}
body.roe.beast .mode.inactive::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .02  0 0 0 0 .05  0 0 0 .9 -.25'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}

.mq{display:none;position:absolute;height:6px;z-index:3;pointer-events:none;
    background:#ff2438;box-shadow:0 0 10px rgba(255,30,50,.8);opacity:.85}
#powerBox .mq{height:4px}
body.roe.beast .mq{display:block}

body.roe.beast .cell{color:#ff6a74}
body.roe.beast .cell.sel .txt{color:#ff9aa4}
body.roe.beast.pw:not(.zero) .cell[data-bar="2"] .redbar,
body.roe.beast.pw:not(.zero) .cell[data-bar="3"] .redbar{opacity:1}

/* 獣化下的 DANGER：抬起 + 整块警报闪（见 dAlert），
   这里只补「文字保持清晰」——不加任何高斯模糊，也不覆盖闪烁用的 opacity */
body.roe.beast .danger-cell .dstk{opacity:1;filter:none}
body.roe.beast .danger-cell .dstk{text-shadow:var(--dGlow,var(--gOn)) !important}
body.roe.beast .hint{color:#ff9aa4;text-shadow:0 0 8px rgba(255,60,80,.5)}

/* 整屏亮度 */
body.roe.beast .inner{animation:beastFlick .5s steps(1,end) infinite}
@keyframes beastFlick{
  0%{filter:brightness(1.08)}6%{filter:brightness(.95)}14%{filter:brightness(1.1)}20%{filter:brightness(.9)}
  26%{filter:brightness(.8)}34%{filter:brightness(1)}40%{filter:brightness(.92)}46%{filter:brightness(.82)}
  54%{filter:brightness(1.05)}60%{filter:brightness(.88)}66%{filter:brightness(.84)}74%{filter:brightness(1.1)}
  80%{filter:brightness(.9)}86%{filter:brightness(.8)}94%{filter:brightness(1)}
}
@media (prefers-reduced-motion:reduce){
  body.roe.beast .danger-cell,body.roe.beast .danger-cell.on{animation:none}
  body.roe.beast .inner,
  body.roe.beast .seg-wrap{animation:none}
}
</style>

(function(){

const SVG_NS = 'http://www.w3.org/2000/svg';

const STAGE_H = 600;

/* 计时参数 */

/* 视图模式 */

const TITLE_JP = ['活動限界まで', '現在の時間は'];

/* 段位布局：l=left  top=顶边  w/h=尺寸  th=笔画粗细  g=段间缝隙 */

  {l:0,   top:0,  w:117, h:229, th:26, g:4},
  {l:153, top:0,  w:117, h:229, th:26, g:4},
  {l:284, top:0,  w:117, h:229, th:26, g:4},

];

const CLOCK_LAYOUT = [
  {l:0,   top:15.5, w:97, h:198, th:22, g:3.5},
  {l:109, top:15.5, w:97, h:198, th:22, g:3.5},

];
const CLOCK_DOTS = [[216.5, 67], [216.5, 159], [458.5, 67], [458.5, 159]];

const SEG_MASK = ['abcdef', 'bc', 'abged', 'abgcd', 'fgbc', 'afgcd', 'afgedc', 'abc', 'abcdefg', 'abfgcd']

const ui = {

  dangerCell: document.getElementById('dangerCell'),
  clockHot:   document.getElementById('clockHot'),
  themeHot:   document.getElementById('themeHot'),
  themeTag:   document.getElementById('themeTag'),
  subBox:     document.getElementById('subBox'),
  fxBg:       document.getElementById('fxBg'),
  fxTop:      document.getElementById('fxTop'),
  titleJP:    document.querySelector('.jpL'),

                .map(cell => ({ cell, barEl: cell.querySelector('.redbar') }))
};
ui.extJP = ui.modeExt.querySelector('.jp');
ui.extEN = ui.modeExt.querySelector('.en');

function syncTitle(el, txt){
  if (el._raw === txt) return;
  el._raw = txt;
  const frag = document.createDocumentFragment();

    const s = document.createElement('span');

  el.textContent = '';
  el.appendChild(frag);
}

function reshuffleTitles(){

let fadeTimer = 0;

function fadeTick(){
  if (document.body.classList.contains('zero')) return;
  const pool = [...document.querySelectorAll('.jpL>span,.enL>span,.atoL>span')]
    .filter(s => s.textContent.trim());
  if (!pool.length) return;
  for (let i = pool.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  const n = Math.min(pool.length, 2 + ((Math.random() * 2) | 0));
  for (let k = 0; k < n; k++){
    const s = pool[k];
    s.classList.add('dim');
    setTimeout(() => s.classList.remove('dim'), 1320);
  }
}

function startFadeTick(){
  if (fadeTimer) return;
  fadeTick();
  fadeTimer = setInterval(fadeTick, 1400);
}

function stopFadeTick(){
  if (!fadeTimer) return;
  clearInterval(fadeTimer);
  fadeTimer = 0;
  for (const s of document.querySelectorAll('.jpL .dim,.enL .dim,.atoL .dim')) s.classList.remove('dim');
}

const FADE_TARGETS = [ui.titleJP, ui.titleEN, ui.titleAto, ui.segWrap];

function buildSegGeometry(width, height, thickness, gap){
  const d = gap * 0.7071;
  const h = thickness / 2;
  const xl = h, xr = width - h;
  const yt = h, ym = height / 2, yb = height - h;
  const horizontal = (x1, x2, y) => [
    [x1 + d, y], [x1 + d + h, y - h], [x2 - d - h, y - h],
    [x2 - d, y], [x2 - d - h, y + h], [x1 + d + h, y + h]
  ];
  const vertical = (x, y1, y2) => [
    [x, y1 + d], [x + h, y1 + d + h], [x + h, y2 - d - h],
    [x, y2 - d], [x - h, y2 - d - h], [x - h, y1 + d + h]
  ];
  return {
    a: horizontal(xl, xr, yt),
    b: vertical(xr, yt, ym),
    c: vertical(xr, ym, yb),
    d: horizontal(xl, xr, yb),
    e: vertical(xl, ym, yb),
    f: vertical(xl, yt, ym),
    g: horizontal(xl, xr, ym)
  };
}

function createDigit(spec, extraClass){
  const geometry = buildSegGeometry(spec.w, spec.h, spec.th, spec.g);
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('class', 'digit' + (extraClass ? ' ' + extraClass : ''));
  svg.setAttribute('viewBox', `0 0 ${spec.w} ${spec.h}`);
  svg.setAttribute('aria-hidden', 'true');
  svg.style.cssText = `left:${spec.l}px;top:${spec.top}px;width:${spec.w}px;height:${spec.h}px`;

  const segs = new Array(7);
  for (let i = 0; i < 7; i++){
    const key = String.fromCharCode(97 + i);
    const polygon = document.createElementNS(SVG_NS, 'polygon');
    polygon.setAttribute('class', 'seg');
    polygon.setAttribute('points', geometry[key].map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' '));
    svg.appendChild(polygon);
    segs[i] = polygon;
  }
  return { el: svg, segs, mask: 0 };
}

function mountDigits(host, digits, dots, dotClass){
  const fragment = document.createDocumentFragment();
  for (const digit of digits) fragment.appendChild(digit.el);
  for (const [x, y] of dots){
    const dot = document.createElement('i');
    dot.className = dotClass;
    dot.style.cssText = `left:${x}px;top:${y}px`;
    fragment.appendChild(dot);
  }
  host.appendChild(fragment);
}

function setDigitMask(digits, index, mask){
  const digit = digits[index];
  if (digit.mask === mask) return;
  const changed = digit.mask ^ mask;
  digit.mask = mask;
  for (let bit = 0; bit < 7; bit++){
    if ((changed >> bit) & 1) digit.segs[bit].classList.toggle('on', !!((mask >> bit) & 1));
  }
}

const countdownDigits = COUNTDOWN_LAYOUT.map(spec => createDigit(spec, 'cd'));
const clockDigits = CLOCK_LAYOUT.map(spec => createDigit(spec, ''));
mountDigits(ui.segWrap, countdownDigits, COUNTDOWN_DOTS, 'dot cd');
mountDigits(ui.clockDig, clockDigits, CLOCK_DOTS, 'dot');

const countdownDotEls = [...ui.segWrap.querySelectorAll('.dot')];
let dotsDithered = false;

function clearDotDither(){
  if (!dotsDithered) return;
  dotsDithered = false;
  for (const dot of countdownDotEls) dot.style.opacity = '';
}

function drawCountdown(ms){
  clearDotDither();
  const centis = Math.floor((ms > 0 ? ms : 0) / 10);
  const seconds = Math.floor(centis / 100) % 60;
  setDigitMask(countdownDigits, 0, SEG_MASK[Math.min(Math.floor(centis / 6000), 9)]);
  setDigitMask(countdownDigits, 1, SEG_MASK[(seconds / 10) | 0]);
  setDigitMask(countdownDigits, 2, SEG_MASK[seconds % 10]);
  setDigitMask(countdownDigits, 3, SEG_MASK[Math.floor(centis / 10) % 10]);
  setDigitMask(countdownDigits, 4, SEG_MASK[centis % 10]);
}

function clearCountdown(){
  clearDotDither();
  for (let i = 0; i < countdownDigits.length; i++) setDigitMask(countdownDigits, i, 0);
}

let timeMarker = '';
function drawClock(is12Hour){
  const now = new Date();
  let hour = now.getHours();
  const meridiem = hour < 12 ? 'AM' : 'PM';
  if (is12Hour){ hour %= 12; if (hour === 0) hour = 12; }
  const minute = now.getMinutes();
  const second = now.getSeconds();

  setDigitMask(clockDigits, 0, SEG_MASK[(hour / 10) | 0]);
  setDigitMask(clockDigits, 1, SEG_MASK[hour % 10]);
  setDigitMask(clockDigits, 2, SEG_MASK[(minute / 10) | 0]);
  setDigitMask(clockDigits, 3, SEG_MASK[minute % 10]);
  setDigitMask(clockDigits, 4, SEG_MASK[(second / 10) | 0]);
  setDigitMask(clockDigits, 5, SEG_MASK[second % 10]);

  const marker = is12Hour ? meridiem : '24';
  if (marker !== timeMarker){ timeMarker = marker; syncTitle(ui.titleAto, marker); }
}

function countSegs(mask){
  let n = 0;
  while (mask){ mask &= mask - 1; n++; }
  return n;
}

function makeGlitchMask(){
  const roll = Math.random();
  if (roll < 0.16) return SEG_MASK[(Math.random() * 10) | 0];
  if (roll < 0.88){
    let mask = SEG_MASK[Math.random() < 0.42 ? 8 : (Math.random() * 10) | 0];
    let cuts = 1 + ((Math.random() * 3) | 0);
    for (let guard = 0; cuts > 0 && guard < 16; guard++){
      const bit = 1 << ((Math.random() * 7) | 0);
      if (mask & bit){ mask &= ~bit; cuts--; }
    }
    return mask;
  }
  let random;
  do { random = (Math.random() * 128) | 0; } while (countSegs(random) < 2 || countSegs(random) > 6);
  return random;
}

function drawScramble(){
  const deadSeg = 1 << ((Math.random() * 7) | 0);
  for (let i = 0; i < countdownDigits.length; i++){
    let mask = makeGlitchMask();
    if (Math.random() < 0.3) mask &= ~deadSeg;
    for (let guard = 0; countSegs(mask) < 2 && guard < 8; guard++) mask |= 1 << ((Math.random() * 7) | 0);
    setDigitMask(countdownDigits, i, mask);
  }
  for (const dot of countdownDotEls) dot.style.opacity = Math.random() < 0.45 ? '0' : '';
  dotsDithered = true;
}

let powered  = false;
let internal = false;
let zero     = false;
let reserve  = false;
let viewMode = VIEW_COUNTDOWN;
let roe     = false;
let beast    = false;

let remainingMs = DURATION_MS;
let endTime     = 0;
let isDanger    = false;
let isRunning   = false;
let isFrozen    = false;

let countdownRaf = 0;
let scrambleRaf  = 0;
let holdTimeout  = 0;
let clockTimeout = 0;
let bootTimer    = 0;

/* DANGER 开关的开机瞬闪：抬起 + 点亮 BOOT_MS，然后落回、熄灭，
   一直保持「按下」相，直到最后 7 秒由 body.danger 重新点亮 */
function bootDanger(){
  if (bootTimer){ clearTimeout(bootTimer); bootTimer = 0; }
  ui.dangerCell.classList.add('boot');
  bootTimer = setTimeout(() => {
    bootTimer = 0;
    ui.dangerCell.classList.remove('boot');
  }, BOOT_MS);
}

function clearBootDanger(){
  if (bootTimer){ clearTimeout(bootTimer); bootTimer = 0; }
  ui.dangerCell.classList.remove('boot');
}

function tick(now){
  if (!isRunning) return;
  remainingMs = endTime - now;
  if (remainingMs < 0) remainingMs = 0;
  drawCountdown(remainingMs);
  setDanger(remainingMs <= DANGER_AT_MS);
  if (remainingMs === 0){ triggerZero(); return; }
  countdownRaf = requestAnimationFrame(tick);
}

function triggerZero(){
  isRunning = false;
  countdownRaf = 0;
  zero = true;
  render();
}

function setLive(on){ ui.segWrap.classList.toggle('live', on); }

function startCountdown(){
  stopCountdown();
  setLive(false);
  remainingMs = DURATION_MS;
  isRunning = true;
  setDanger(false);
  drawScramble();

  const startedAt = performance.now();
  let nextFrameAt = SCRAMBLE_HOLD;

  const step = () => {
    const elapsed = performance.now() - startedAt;
    if (elapsed >= SCRAMBLE_MS){
      scrambleRaf = 0;
      setLive(true);
      drawCountdown(DURATION_MS);
      bootDanger();                         /* 倒计时真正开始：开关抬起点亮 0.4s */
      holdTimeout = setTimeout(() => {
        holdTimeout = 0;
        endTime = performance.now() + remainingMs;
        countdownRaf = requestAnimationFrame(tick);
      }, HOLD_MS);
      return;
    }
    if (elapsed >= nextFrameAt){ drawScramble(); nextFrameAt += SCRAMBLE_HOLD; }
    scrambleRaf = requestAnimationFrame(step);
  };
  scrambleRaf = requestAnimationFrame(step);
}

function stopCountdown(){
  isRunning = false;
  isFrozen = false;
  clearBootDanger();
  if (countdownRaf){ cancelAnimationFrame(countdownRaf); countdownRaf = 0; }
  if (scrambleRaf){ cancelAnimationFrame(scrambleRaf); scrambleRaf = 0; }
  if (holdTimeout){ clearTimeout(holdTimeout); holdTimeout = 0; }
}

function freezeCountdown(){
  if (!isRunning) return;
  if (countdownRaf) remainingMs = Math.max(0, endTime - performance.now());
  stopCountdown();
  isFrozen = true;
}

function resumeCountdown(){
  endTime = performance.now() + remainingMs;
  isRunning = true;
  isFrozen = false;
  setLive(true);
  setDanger(remainingMs <= DANGER_AT_MS);
  countdownRaf = requestAnimationFrame(tick);
}

function syncCountdown(){
  if (!powered || !internal || zero || reserve){
    stopCountdown();
    if (zero){
      setLive(true);
    } else if (reserve && powered && !internal){
      setLive(false); setDanger(false); remainingMs = 0; drawCountdown(0);
    } else {
      setLive(false); setDanger(false); remainingMs = DURATION_MS; clearCountdown();
    }
    return;
  }
  if (viewMode !== VIEW_COUNTDOWN) freezeCountdown();
  else if (isFrozen) resumeCountdown();
  else if (!isRunning) startCountdown();
}

function startClock(){
  if (clockTimeout) return;
  const step = () => {
    clockTimeout = 0;
    if (viewMode === VIEW_COUNTDOWN) return;
    drawClock(viewMode === VIEW_CLOCK_12);
    clockTimeout = setTimeout(step, 1000 - (Date.now() % 1000) + 10);
  };
  step();
}

function stopClock(){
  if (clockTimeout){ clearTimeout(clockTimeout); clockTimeout = 0; }
  timeMarker = '';
}

function applyDangerClass(){
  document.body.classList.toggle('danger', isDanger && viewMode === VIEW_COUNTDOWN);
}

function setDanger(on){
  if (isDanger === on) return;
  isDanger = on;
  applyDangerClass();
}

function setActiveBar(index, hideRest){
  for (let i = 0; i < ui.bars.length; i++){
    ui.bars[i].barEl.classList.toggle('on', i === index);
    ui.bars[i].cell.classList.toggle('sel', i === index);
    ui.bars[i].cell.classList.toggle('gone', !!hideRest && i !== index);
  }
}

function runPowerSequence(){
  setActiveBar(-1);
  [120, 220, 320].forEach((delay, index) => setTimeout(() => {
    if (powered && !internal && !zero) setActiveBar(index);
  }, delay));
}

function crossFade(){
  for (const el of FADE_TARGETS) el.classList.remove('vswap');
  void ui.panel.offsetWidth;
  for (const el of FADE_TARGETS) el.classList.add('vswap');
}

function render(){
  const isClock = viewMode !== VIEW_COUNTDOWN;
  const isInternal = powered && internal;
  const isReserve = powered && !internal && reserve;

  if (!roe || !powered) beast = false;
  document.body.classList.toggle('roe', roe);
  document.body.classList.toggle('beast', beast);
  ui.themeTag.textContent = roe ? 'ROE' : 'EOE';
  document.body.classList.toggle('pw', powered);
  document.body.classList.toggle('clk', isClock);
  document.body.classList.toggle('zero', zero);
  document.body.classList.toggle('reserve', isReserve);
  document.body.dataset.mode = internal ? 'internal' : 'external';
  applyDangerClass();

  syncTitle(ui.titleJP, TITLE_JP[isClock ? 1 : 0]);
  syncTitle(ui.titleEN, TITLE_EN[isClock ? 1 : 0]);
  ui.extJP.textContent = isReserve ? '予備' : '外部';
  ui.extEN.textContent = isReserve ? 'AUXILIARY' : 'EXTERNAL';

  for (const [el, isOn] of [[ui.modeExt, powered && !internal], [ui.modeInt, isInternal]]){
    el.classList.toggle('active', isOn);
    el.classList.toggle('inactive', !isOn);
    el.classList.toggle('dead', !powered);
    el.tabIndex = powered ? 0 : -1;
  }
  ui.modeExt.classList.toggle('resv', isReserve);
  ui.segWrap.classList.toggle('idle', !isClock && !isInternal && !isReserve);
  ui.dangerCell.classList.toggle('on', isInternal && !isClock);
  ui.powerBox.classList.toggle('off', !powered);

  const zeroLook = zero && !isClock;
  setActiveBar(!powered || isReserve ? -1 : (zeroLook ? 0 : (internal ? 3 : 2)), zeroLook);

  if (isClock){
    timeMarker = '';
    drawClock(viewMode === VIEW_CLOCK_12);
    if (powered) startClock(); else stopClock();
  } else {
    syncTitle(ui.titleAto, 'あと');
    stopClock();
  }

  syncCountdown();
  if (beast) startBeast(); else stopBeast();
}

function bindActivate(el, handler){
  el.addEventListener('click', handler);
  el.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' '){ event.preventDefault(); handler(event); }
  });
}

bindActivate(ui.powerBox, () => {
  powered = !powered;
  internal = false;
  zero = false;
  reserve = false;
  viewMode = VIEW_COUNTDOWN;
  render();
  if (powered) runPowerSequence();
});

bindActivate(ui.modeInt, () => {
  if (!powered || (internal && !zero)) return;
  internal = true; zero = false; reserve = false;
  render();
});

bindActivate(ui.modeExt, () => {
  if (!powered) return;
  if (internal){
    internal = false; zero = false; reserve = false;
    render();
    return;
  }
  if (viewMode !== VIEW_COUNTDOWN) return;
  zero = false;
  reserve = !reserve;
  render();
});

bindActivate(ui.clockHot, () => {
  viewMode = (viewMode + 1) % VIEW_COUNT;
  if (viewMode !== VIEW_COUNTDOWN) reserve = false;
  render();
  crossFade();
});

bindActivate(ui.themeHot, () => {
  roe = !roe;
  render();
});
['pointerenter', 'focus'].forEach(type => ui.themeHot.addEventListener(type, () => ui.themeTag.classList.add('show')));
['pointerleave', 'blur'].forEach(type => ui.themeHot.addEventListener(type, () => ui.themeTag.classList.remove('show')));

ui.bars.forEach(({ cell }, index) => bindActivate(cell, () => {
  if (!powered || zero || reserve) return;
  setActiveBar(index);
}));

/* ══ 獣化 ══ */
const FX_FRAME_MS = 33;
const FX_W = 1500, FX_H = 600;   /* 两张 fx 画布的坐标空间（与 canvas 的 width/height 一致） */
const fxReduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fxBgCtx  = ui.fxBg.getContext('2d');
const fxTopCtx = ui.fxTop.getContext('2d');
const fxDigits = [...ui.segWrap.querySelectorAll('.digit')].map(d => [...d.querySelectorAll('.seg')]);
const fxSegs   = fxDigits.flat();
const fxRnd = n => Math.random() * n;

/* ① 撕裂：A / D / C 组 */
const fxTearGroups = [
  { key: 'A', els: [ui.titleJP, ui.titleAto], p: 0.8 },
  { key: 'D', els: [ui.titleEN],              p: 0.45 },
  { key: 'C', els: [ui.powerBox, ui.modeInt, ui.modeExt], p: 0.7 }
];
for (const g of fxTearGroups) g.turb = document.getElementById('fxTurb' + g.key);
function fxTear(){
  for (const g of fxTearGroups){
    if (!g.turb) continue;
    g.turb.setAttribute('seed', (Math.random() * 1000) | 0);
    g.turb.setAttribute('baseFrequency', '0 ' + (0.03 + Math.random() * 0.09).toFixed(3));
    for (const el of g.els) el.style.filter = Math.random() < g.p ? 'url(#fxTear' + g.key + ')' : '';
  }
}

/* ② 生命周期跑马灯（三个盒子同构，用同一段查询生成，顺序 = 内部 / 主電源 / 外部） */
const fxMqBoxes = [ui.modeInt, ui.powerBox, ui.modeExt]
  .map(box => ({ bars: [...box.querySelectorAll('.mq')], states: [] }));
function initMqState(){ return { x: 0, y: 0, w: 0, life: 0 }; }
function resetMqState(state){
  state.x = Math.random() * 60;
  state.y = Math.random() * 85;
  state.w = 10 + Math.random() * 50;
  state.life = 5 + Math.floor(Math.random() * 25);
}
function fxMarquee(){
  for (const box of fxMqBoxes){
    box.bars.forEach((bar, i) => {
      if (!box.states[i]) box.states[i] = initMqState();
      const s = box.states[i];
      
      if (s.life > 0) {
        s.life--;
        return; 
      }

      // 寿命结束，随机重生或隐身
      if (Math.random() < 0.3) {
        s.life = Math.floor(Math.random() * 10);
        bar.style.display = 'none';
        return;
      }

      resetMqState(s);
      bar.style.display = 'block';
      bar.style.left = s.x + '%';
      bar.style.top = s.y + '%';
      bar.style.width = Math.min(s.w, 100 - s.x) + '%';
    });
  }
}

function fxHollow(){
  for (const seg of fxSegs){
    seg.classList.toggle('hl',
      seg.classList.contains('on') && Math.random() < 0.08);
  }
  const whole = Math.random() < 0.5 ? 0 : 1;
  for (let n = 0; n < whole; n++){
    for (const seg of fxDigits[(Math.random() * fxDigits.length) | 0]){
      if (seg.classList.contains('on')) seg.classList.add('hl');
    }
  }
}

let fxBlocks = [];
function fxMakeBlock(){
  const topBias = Math.random() < 0.55;
  const x = topBias
    ? 205 + Math.random() * 1000
    : 205 + Math.pow(Math.random(), 1.2) * 820;
  const y = topBias
    ? 48 + Math.pow(Math.random(), 1.6) * 160
    : 48 + Math.pow(Math.random(), 1.4) * 520;
  const w = (1 + Math.floor(Math.pow(Math.random(), 2.2) * 10)) * 8;
  const h = Math.random() < 0.82 ? 8 : (Math.random() < 0.7 ? 16 : 24);
  const r = Math.random();
  const c = r < 0.52 ? '#0b0206' : r < 0.74 ? '#6e0a18' : r < 0.92 ? '#ff3640' : 'rgba(255,140,150,.85)';
  return { x: Math.round(x / 8) * 8, y: Math.round(y / 8) * 8, w, h, c };
}
function fxDrawBg(){
  fxBgCtx.clearRect(0, 0, FX_W, FX_H);
  for (const b of fxBlocks){ fxBgCtx.fillStyle = b.c; fxBgCtx.fillRect(b.x, b.y, b.w, b.h); }
}
function fxDrawTop(){
  fxTopCtx.clearRect(0, 0, FX_W, FX_H);
  const bars = Math.random() < 0.6 ? 1 + ((Math.random() * 2) | 0) : 0;
  for (let i = 0; i < bars; i++){
    fxTopCtx.fillStyle = `rgba(255,${(40 + fxRnd(60)) | 0},${(50 + fxRnd(40)) | 0},${(0.14 + fxRnd(0.26)).toFixed(2)})`;
    fxTopCtx.fillRect(590 + fxRnd(500), 200 + fxRnd(200), 90 + fxRnd(300), 6 + fxRnd(10));
  }
  const rects = (Math.random() * 4) | 0;
  fxTopCtx.fillStyle = 'rgba(28,0,6,.3)';
  for (let i = 0; i < rects; i++) fxTopCtx.fillRect(590 + fxRnd(560), 190 + fxRnd(210), 30 + fxRnd(110), 16 + fxRnd(46));
}

let fxOn = false, fxRaf = 0, fxLast = 0, fxFrame = 0;
function fxStep(){
  fxMarquee();
  if (fxFrame % 2 === 0){
    fxTear();
    fxHollow();
    for (let i = 0; i < fxBlocks.length; i++) if (Math.random() < 0.3) fxBlocks[i] = fxMakeBlock();
    fxDrawBg();
    fxDrawTop();
  }
  fxFrame++;
}
function fxLoop(now){
  fxRaf = requestAnimationFrame(fxLoop);
  if (now - fxLast < FX_FRAME_MS) return;
  fxLast = now;
  fxStep();
}
function startBeast(){
  if (fxOn) return;
  fxOn = true; fxFrame = 0;
  reshuffleTitles();
  startFadeTick();
  fxBlocks = Array.from({ length: 120 }, fxMakeBlock);
  for(const box of fxMqBoxes) box.states = [];
  if (fxReduce) fxStep();
  else fxRaf = requestAnimationFrame(fxLoop);
}
function stopBeast(){
  if (!fxOn) return;
  fxOn = false;
  stopFadeTick();
  if (fxRaf){ cancelAnimationFrame(fxRaf); fxRaf = 0; }
  fxBgCtx.clearRect(0, 0, FX_W, FX_H);
  fxTopCtx.clearRect(0, 0, FX_W, FX_H);
  for (const seg of fxSegs) seg.classList.remove('hl');
  for (const g of fxTearGroups) for (const el of g.els) el.style.filter = '';
  for (const box of fxMqBoxes) {
    for (const bar of box.bars) {
      bar.style.display = '';
      bar.style.left = '';
      bar.style.top = '';
      bar.style.width = '';
    }
  }
}

const SUB_URL = 'https://www.bilibili.com/video/BV1HAHF6oEdi';
function onSubbox(event){
  if (roe && !(event.ctrlKey || event.metaKey || event.shiftKey)){
    if (!powered) return;
    beast = !beast;
    render();
    return;
  }
  window.open(SUB_URL, '_blank');
}
bindActivate(ui.subBox, onSubbox);
addEventListener('keydown', event => {
  if (event.key === 'Escape' && beast){ beast = false; render(); }
});

let fitQueued = false;
function fitPanel(){
  fitQueued = false;
  const scale = Math.min(
    innerWidth / STAGE_W,
    (innerHeight - STAGE_V_MARGIN) / STAGE_H
  );
  ui.panel.style.transform = `translate(-50%,-50%) scale(${scale})`;
}
addEventListener('resize', () => {
  if (fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(fitPanel);
}, { passive: true });

render();
fitPanel();
requestAnimationFrame(() => requestAnimationFrame(() => {
  powered = true;
  render();
  runPowerSequence();
}));

})();
</script>
</body>
</html>
