<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>ACTIVE TIME REMAINING // EVA TIMER — FRONT VIEW</title>
<style>
@font-face{
  font-family:"EVA Matisse";
  src:url("./font/EVA-Matisse_Classic.ttf")format("truetype");
  font-display:block;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}

/* ============ 主题变量 ============ */
body{
  font-family:"EVA Matisse",serif;user-select:none;
  --amber:#ffac1e;
  --red:#ff2415;
  --cyan:#3fd8ff;
  --glow:0 0 9px rgba(255,150,20,.9),0 0 24px rgba(255,110,10,.55),0 0 56px rgba(255,90,0,.3);
  --seg-glow:0 0 6px rgba(255,165,35,.6),0 0 14px rgba(255,110,10,.28);
  --seg-bloom:drop-shadow(0 0 4px rgba(255,170,40,.5)) drop-shadow(0 0 12px rgba(255,110,10,.28));
  --cyan-glow:0 0 3px rgba(63,216,255,.7);
  --tick:linear-gradient(var(--cyan),var(--cyan));
  /* 背景渐变 */
  --rb:linear-gradient(180deg,#000 0 48px,transparent 48px) 0 0/1500px 600px no-repeat,
       linear-gradient(to top right,#b2403c 0,#b58a3a 20%,#a9be4a 30%,#81ba5d 38%,#55995a 64%,#3f8aa0 80%,#3f68ae 92%,#4b4fb0 100%) 200px 0/1300px 600px no-repeat;
}
/* 最后 7 秒警戒：只改 UI 字体 / 描边 / gline / gradbar，不加整体红色滤镜，--cyan 保持青蓝 */
body.danger{
  --amber:#ff2415;
  --glow:0 0 11px rgba(255,40,20,.95),0 0 33px rgba(255,20,10,.7),0 0 78px rgba(255,10,0,.4);
  --seg-glow:0 0 6px rgba(255,60,30,.65),0 0 14px rgba(255,20,10,.3);
  --seg-bloom:drop-shadow(0 0 4px rgba(255,60,30,.55)) drop-shadow(0 0 12px rgba(255,20,10,.3));
}

/* ============ 画布 1300×600：裁掉左侧留白，只留到装甲外一点 ============ */
.panel{position:absolute;left:50%;top:50%;width:1300px;height:600px;transform-origin:center;overflow:hidden;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.85))}
.inner{position:absolute;left:-200px;top:0;width:1500px;height:600px;background:#000}

/* ============ 充电式装甲充能 ============
   未通电时纯黑，通电后装甲沿渐变方向（左下→右上）充满。
   mask 等色线平行于反对角线（斜率 H/W=0.4），固定 X、动画 Y 即可让分界线
   恰好从面板左下角扫到右上角。
   .chargelayer 与装甲共用同一套扫掠遮罩：gline / 刻度随充能扫过才显现。 */
.charge,.chargelayer{
  position:absolute;inset:0;pointer-events:none;
  mask-image:linear-gradient(to top right,#000 0 50%,transparent 52%);
  mask-repeat:no-repeat;mask-size:6000px 2400px;mask-position:-1500px 0;
  transition:mask-position .5s cubic-bezier(.35,.1,.25,1)}
.charge{background:var(--rb)}
body.pw .charge,body.pw .chargelayer{mask-position:-1500px -1200px}

/* ============ 画面最左缘：黑色竖条 + 短划刻度列 ============ */
.leftbar{position:absolute;left:220px;top:0;width:5px;height:600px;background:#000}
/* 短划列自 y=32 起，3px 实 + 47px 空，与 tk.t2 的黑色小竖刻度同粗 */
.leftdash{position:absolute;left:230px;top:32px;width:15px;height:600px;
  background:repeating-linear-gradient(180deg,#000 0 3px,transparent 3px 40px)}

/* ============ 绝对定位通用类 ============ */
.abs{position:absolute}

/* ============ 装甲 SVG ============ */
.deco{position:absolute;inset:0;width:1500px;height:600px;overflow:visible}
.deco .blk{fill:#000;stroke:var(--amber);stroke-width:2;stroke-linejoin:miter;filter:drop-shadow(0 0 4px rgba(255,150,20,.5))}
.deco .blk0{fill:#000;stroke:none}
/* 标题左侧小方块：视图切换开关（倒计时 / 24H / 12H）
   不能用 outline —— SVG 上的 outline 会沿元素包围盒画一个矩形框（点完就留一个方框）。
   鼠标点击后不显示任何框，只有键盘 Tab 聚焦时用描边高亮。 */
.deco .clk{cursor:pointer;outline:none}
.deco .clk:focus-visible{stroke:var(--cyan);stroke-width:2.5;
  filter:drop-shadow(0 0 5px rgba(63,216,255,.55))}
body.danger .deco .blk{filter:drop-shadow(0 0 4px rgba(255,40,20,.6))}

/* ============ 刻度 ============ */
.tk{position:absolute;pointer-events:none;filter:drop-shadow(0 0 3px rgba(63,216,255,.7))}
.tk.t1{left:70px;top:36px;width:1430px;height:9px;background:
  repeating-linear-gradient(90deg,var(--cyan) 0 3px,transparent 3px 12px,var(--cyan) 12px 15px,transparent 15px 100px)}
.tk.t2{left:76px;top:50px;width:1424px;height:11px;filter:none;
  background:repeating-linear-gradient(90deg,#000 0 3px,transparent 3px 100px)}
/* 底部刻度：下排与上排全部同位对齐，另只在短间距（45px，即按钮间隔处）的中点加一根；
   长间距中点不放。上排 = 568(屏底青刻度) + 按钮黑竖线 8 根 + 1216(DANGER 框左缘) + 1303/1398(右端 gap) */
.tk.b1{left:0;top:490px;width:1500px;height:8px;background:
  var(--tick) 568px 0/3px 100% no-repeat,
  var(--tick) 629px 0/3px 100% no-repeat,
  var(--tick) 724px 0/3px 100% no-repeat,
  var(--tick) 769px 0/3px 100% no-repeat,
  var(--tick) 864px 0/3px 100% no-repeat,
  var(--tick) 909px 0/3px 100% no-repeat,
  var(--tick) 1004px 0/3px 100% no-repeat,
  var(--tick) 1049px 0/3px 100% no-repeat,
  var(--tick) 1144px 0/3px 100% no-repeat,
  var(--tick) 1216px 0/3px 100% no-repeat,
  var(--tick) 1303px 0/3px 100% no-repeat,
  var(--tick) 1398px 0/3px 100% no-repeat}
.tk.b2{left:0;top:506px;width:1500px;height:8px;background:
  var(--tick) 568px 0/3px 100% no-repeat,
  var(--tick) 629px 0/3px 100% no-repeat,
  var(--tick) 746.5px 0/3px 100% no-repeat,
  var(--tick) 886.5px 0/3px 100% no-repeat,
  var(--tick) 1026.5px 0/3px 100% no-repeat,
  var(--tick) 1180px 0/3px 100% no-repeat,
  var(--tick) 1303px 0/3px 100% no-repeat,
  var(--tick) 1398px 0/3px 100% no-repeat}

/* 青蓝竖线：接通主電源供給システム 后随背景扫掠（左下→右上）逐个亮起，--d 为延迟 */
.cy{fill:var(--cyan)}
.cy>use{filter:drop-shadow(0 0 3px rgba(63,216,255,.7));opacity:0;transition:opacity .14s linear}
body.pw .cy>use{opacity:1;transition-delay:var(--d,0ms)}
/* 装甲上的黑色刻度：恒为黑色、无辉光，不随警戒变色 */
.bk{fill:#000;filter:none}
/* 黑色刻度旁的黄色竖线对（参考图 STOP 左侧：黑对 + 黄对） */
.ye{fill:var(--amber);filter:drop-shadow(0 0 3px rgba(255,176,30,.5))}
body.danger .ye{filter:drop-shadow(0 0 3px rgba(255,40,20,.6))}

/* 下端止于底部黑区绿线（gline 顶端 y=500），与该线垂直相接 */
.gradbar{position:absolute;left:1405px;top:148px;width:7px;height:352px;z-index:6;opacity:.95;
  background:linear-gradient(180deg,#00e05a,#b8f000 28%,#ffc400 52%,#ff2020 76%,#b400ff);
  box-shadow:0 0 13px rgba(255,200,60,.45),0 0 28px rgba(180,0,255,.25);transition:background .4s}
body.danger .gradbar{background:linear-gradient(180deg,#7a0000,#ff2020 35%,#8a0000 65%,#ff3030);
  box-shadow:0 0 16px rgba(255,30,20,.6)}
/* 左端与带内第一条青色竖刻度（tk.b1 首刻度 x=568）对齐，右端止于 gradbar 左缘 1404 */
.gline{left:568px;top:500px;width:844px;height:4px;
  background:linear-gradient(90deg,#ffe600,#6fcf3a);box-shadow:0 0 6px rgba(255,200,40,.45);
  transition:background .4s,box-shadow .4s}
body.danger .gline{background:linear-gradient(90deg,#ff2a14,#ff6a2a);box-shadow:0 0 6px rgba(255,40,20,.6)}

/* ============ 标题文字 ============ */
.glow{color:var(--amber);text-shadow:var(--glow)}
.jpL{left:522px;top:128px;font-size:38px;font-weight:700;line-height:52px;letter-spacing:.02em;white-space:nowrap}
.enL{left:770px;top:148px;font-size:23px;line-height:28px;font-family:Arial,"Helvetica Neue",sans-serif;
  white-space:nowrap;letter-spacing:-2px}
.atoL{left:530px;top:178px;font-size:28px;line-height:38px;font-weight:700}

/* ============ 数码管 ============
   left 591：数位墨迹 591–1208，与左邻屏内缘(583)、右邻方框(1216)的黑色均为 8px；
   top 185：字形顶与「あと」字形顶（y≈185）齐平；高度 229。 */
.seg-wrap{left:591px;top:185px;width:618px;height:229px}
.digit{position:absolute;overflow:visible;filter:var(--seg-bloom)}
.seg{fill:var(--amber);opacity:.07}
.seg.on{opacity:1}
.dot{position:absolute;width:15px;height:13px;background:var(--amber);box-shadow:var(--seg-glow)}
.seg-wrap.idle .cd .seg{opacity:.07}
.seg-wrap.idle .dot{opacity:0}
/* 未接通主電源供給システム：屏幕灭 —— 任何视图下数码管都不亮。
   开关只认 .pw 一个条件，不再让 .clk 把它顶开（否则断电就能看到时钟）。
   通电后才出时间：倒计时出 5:00.00，时钟视图出 HH:MM:SS。 */
body:not(.pw) .seg-wrap{visibility:hidden}

/* ============ 时钟视图（点击「活動限界まで」左侧小方块循环切换） ============
   6 位 HH:MM:SS：时·分 97×198、秒 62×127，两组冒号。
   断电时仍可切（标题跟着换），但屏幕是黑的，不跑秒。 */
.clock-dig{position:absolute;inset:0;display:none}
body.clk .clock-dig{display:block}
body.clk .cd{display:none}

/* ============ 右列方框 ============ */
.box{position:absolute;left:1216px;width:182px;border:2px solid var(--amber);background:#000;
  box-shadow:var(--glow);color:var(--amber);text-shadow:var(--glow)}
#modeInternal{top:182px;height:84px}
.powerbox{top:276px;height:42px}
#modeExternal{top:328px;height:84px}
.mode .jp{position:absolute;left:8px;top:0;font-size:56px;font-weight:700;line-height:62px;white-space:nowrap}
.mode .en{position:absolute;left:8px;bottom:0;font-size:24px;line-height:26px;font-family:Arial,"Helvetica Neue",sans-serif}
.mode::after{content:"";position:absolute;top:0;bottom:0;right:0;width:40px;
  background:linear-gradient(-45deg,#e8000e 0 12.5%,#150202 12.5% 25%,#e8000e 25% 37.5%,#150202 37.5% 50%,#e8000e 50% 62.5%,#150202 62.5% 75%,#e8000e 75% 87.5%,#150202 87.5%)}
.powerbox{cursor:pointer}
.powerbox.off{animation:pulse 1.6s infinite}
.powerbox .jp{position:absolute;left:6px;top:1px;font-size:19px;font-weight:700;line-height:22px;white-space:nowrap}
.powerbox .en{position:absolute;left:6px;bottom:2px;font-size:10.5px;line-height:13px;font-family:Arial,sans-serif;white-space:nowrap}
.mode{transition:opacity .3s,filter .3s}
.mode.inactive{opacity:.34;cursor:pointer}
.mode.active{cursor:pointer;animation:pulse 1.6s infinite}
/* 未通电：内部 / 外部 完全不显示（含边框），通电后淡入 */
.mode.dead,.mode.dead.inactive{opacity:0;animation:none;filter:none;pointer-events:none;
  color:#000;text-shadow:none;border-color:transparent;box-shadow:none}
.mode.dead .jp,.mode.dead .en{opacity:0}
.mode.dead::after{opacity:0}
@keyframes pulse{0%,100%{filter:brightness(1.1)}50%{filter:brightness(1.4)}}

/* ============ 连接处的青色分隔刻度 ============ */
.sep{position:absolute;left:1216px;width:182px;height:10px}
.sep i{position:absolute;top:1px;width:3px;height:8px;background:var(--cyan);
  box-shadow:0 0 6px rgba(63,216,255,.5);opacity:0;transition:opacity .14s linear}
.sep i.l{left:0}
.sep i.r{right:0}
/* 屏幕最下一条：贴屏底黄线之上但不得压线（方框底 412 / 黄线起于 419） */
.sep.sm{height:6px}
.sep.sm i{height:5px;top:0}
body.pw .sep i{opacity:1;transition-delay:var(--d,0ms)}

/* ============ 按钮 ============ */
.cell{position:absolute;top:428px;width:100px;height:48px;border:2px solid var(--amber);
  box-shadow:var(--glow);color:var(--amber);text-shadow:var(--glow);cursor:pointer;text-align:center;
  background:linear-gradient(180deg,rgba(70,25,95,.16),rgba(120,25,45,.12)),#030100}
.cell .txt{position:relative;z-index:2;display:block;font-family:Arial,"Helvetica Neue",sans-serif;
  font-size:21px;line-height:24px}
.cell .redbar{position:absolute;left:0;right:0;bottom:0;height:50%;background:var(--red);
  box-shadow:0 0 16px var(--red),0 0 33px rgba(255,30,15,.45);z-index:1;opacity:0;transition:opacity .16s}
.cell:hover .redbar{opacity:.22}
.cell .redbar.on{opacity:1}
/* 归零（活動限界到達）：SLOW / NORMAL / RACING 只隐藏文字，黑框与下方黑竖线保留，只留 STOP 红条 */
.cell.gone .txt{visibility:hidden}
.cell:active{filter:brightness(1.15)}
/* 按钮下方与边缘严格对齐的黑色刻度：恒为黑色，不随警戒变色 */
.cell::after{content:"";position:absolute;left:-4px;right:-4px;top:100%;margin-top:3.5px;height:8px;
  background:
    linear-gradient(#000,#000) left 3px top 0/3px 8px no-repeat,
    linear-gradient(#000,#000) right 3px top 0/3px 8px no-repeat
  }
/* 未通电：STOP / SLOW / NORMAL / RACING 连边框、文字、辉光一起不显示（与 .mode.dead 同理）。
   transition 只写在 .pw 下 —— 通电时淡入，断电时瞬间熄灭，符合 CRT 断电的观感。 */
body:not(.pw) .cell{opacity:0;pointer-events:none}
body.pw .cell{transition:opacity .28s}

/* ============ 红色预警框（DANGER EMERGENCY / 購読する） ============ */
.danger-cell,.subbox{position:absolute;top:428px;height:48px;border:2px solid var(--red);
  color:var(--red);background:#030100;text-align:center;
  text-shadow:0 0 11px rgba(255,40,20,.9),0 0 31px rgba(255,20,10,.6);
  box-shadow:0 0 16px rgba(255,30,15,.8),inset 0 0 22px rgba(255,40,20,.25)}
.danger-cell{left:1216px;width:84px;padding-top:4px;transition:opacity .3s}
.subbox{left:1312px;width:84px;box-shadow:0 0 16px rgba(255,30,15,.8),inset 0 0 20px rgba(255,30,15,.15)}
/* 未通电：不显示 */
body:not(.pw) .danger-cell,body:not(.pw) .subbox{visibility:hidden}
/* 上下两行按字符均分、拉伸到同一宽度（与購読する 同一手法） */
.danger-cell .dstk{width:74px;margin:0 auto;display:flex;flex-direction:column;gap:3px}
.danger-cell .dstk>div{display:flex;justify-content:space-between;
  font-family:Arial,"Helvetica Neue",sans-serif;font-weight:700;font-size:12px;line-height:17px}
.danger-cell:not(.on){opacity:.22}
.danger-cell.on{animation:pulse .7s infinite}
body.danger .danger-cell.on{animation:dangerblink .45s steps(1) infinite}
@keyframes dangerblink{50%{opacity:.25}}
.subbox .stack{width:92%;margin:0 auto;display:flex;flex-direction:column}
.subbox .stack>div{display:flex;justify-content:space-between;font-family:Arial,sans-serif;font-weight:700}
.subbox .stack>div.jp{font-family:"EVA Matisse",serif;font-size:17px;line-height:20px;font-weight:700}
.subbox .en1{font-size:11px;line-height:12px}
.subbox .en2{font-size:6px;line-height:8px}

/* ============ 归零（活動限界到達）：两组各自同频、彼此不同频的闪烁 ============ */
/* A 组：活動限界まで / ACTIVE TIME REMAINING: / あと / DANGER EMERGENCY
   只在倒计时视图闪 —— 时钟视图是"看时间"，不该有警报闪动 */
body.zero:not(.clk) .jpL,body.zero:not(.clk) .enL,body.zero:not(.clk) .atoL,
body.zero:not(.clk) .danger-cell,body.danger.zero:not(.clk) .danger-cell.on{animation:zeroA .5s steps(1) infinite}
@keyframes zeroA{0%,100%{opacity:1}50%{opacity:.1}}
/* B 组：内部框斑马柱 + 按钮下方红条（归零后只保留 STOP）——频率与 A 组不同 */
body.zero:not(.clk) .mode.active::after,body.zero:not(.clk) .cell .redbar.on{animation:zeroB .78s steps(1) infinite}
@keyframes zeroB{0%,100%{opacity:1}50%{opacity:.08}}

.vswap{animation:vswap .24s ease-out both}
@keyframes vswap{from{opacity:0}to{opacity:1}}
.hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;z-index:40;pointer-events:none;
  font-family:"Microsoft YaHei",sans-serif;font-size:12px;letter-spacing:.14em;
  color:var(--amber);opacity:.45;text-shadow:0 0 8px rgba(255,150,20,.4)}

/* 键盘可达性：仅键盘聚焦时显示描边 */
.box:focus-visible,.cell:focus-visible{outline:2px solid currentColor;outline-offset:4px}
</style>
</head>
<body>
<div class="panel" id="panel"><div class="inner">
  <div class="charge"></div>
  <div class="leftbar"></div><div class="leftdash"></div>
  <svg class="deco" viewBox="0 0 1500 600" aria-hidden="true">
    <!-- 刻度形状：定义一次，下方所有 <use href="#bar"> 共用（defs 不渲染） -->
    <defs>
      <rect id="bar" width="2" height="7"/>
      <rect id="barR" x="-1.5" y="-3.5" width="2" height="7" transform="rotate(30)"/>
    </defs>
    <polygon class="blk0" points="440,600 560,488 1500,488 1500,600"/>
    <polygon class="blk" points="515,222 583,222 583,420 515,420 437,530.5 352,502.5"/>
    <polygon class="blk" points="348,509.5 433,537.5 388.9,600 295.4,600"/>
    <polygon id="clockHot" class="blk clk" points="488,128 513,128 513,175 488,168" role="button" tabindex="0" aria-label="切换视图：倒计时 / 24H / 12H"/>
    <polygon class="blk" points="515,128 765,128 780,148 1405,148 1405,420 583,420 583,222 515,222"/>
    <polygon class="blk0" points="1202,422 1405,422 1405,489 1202,489"/>
    <!-- 黑色竖条 -->
    <g class="bk">
      <use href="#bar" x="487" y="116"/>
      <use href="#bar" x="511" y="116"/>
      <use href="#bar" x="763" y="116"/>
      <use href="#bar" x="476" y="132"/>
      <use href="#bar" x="481" y="132"/>
      <use href="#bar" x="782" y="136"/>
      <use href="#bar" x="1011" y="136"/>
      <use href="#bar" x="1216" y="136"/>
      <use href="#bar" x="1396" y="136"/>
      <use href="#bar" x="476" y="162"/>
      <use href="#bar" x="481" y="162"/>
      <use href="#bar" x="503" y="212"/>
      <use href="#bar" x="508" y="212"/>
      <use href="#bar" x="519" y="425"/>
      <use href="#bar" x="592" y="425"/>
      <use href="#bar" x="597" y="425"/>
      <use href="#bar" x="1184" y="425"/>
      <use href="#bar" x="1189" y="425"/>
      <use href="#bar" x="1184" y="479"/>
      <use href="#bar" x="1189" y="479"/>
    </g>
    <g class="ye" transform="translate(0 425)">
      <use href="#bar" x="603"/>
      <use href="#bar" x="608"/>
      <use href="#bar" x="745"/>
      <use href="#bar" x="749"/>
      <use href="#bar" x="885"/>
      <use href="#bar" x="889"/>
      <use href="#bar" x="1025"/>
      <use href="#bar" x="1029"/>
      <use href="#bar" x="1173"/>
      <use href="#bar" x="1178"/>
      <use href="#bar" x="1303"/>
      <use href="#bar" x="1307"/>
      <use href="#bar" x="1398"/>
      <use href="#bar" x="1402"/>
    </g>
    <g class="cy">
      <!-- 青色竖线 -->
      <use style="--d:215ms" href="#bar"  x="519" y="228"/>
      <use style="--d:227ms" href="#bar"  x="568" y="228"/>
      <use style="--d:70ms"  href="#bar"  x="519" y="411"/>
      <use style="--d:82ms"  href="#bar"  x="568" y="411"/>
      <!-- 斜槽四角内的青色刻度 -->
      <use style="--d:12ms" href="#barR" x="360.05" y="498.83"/>
      <use style="--d:36ms" href="#barR" x="432.7"  y="522.77"/>
      <use style="--d:0ms"  href="#barR" x="352.3"  y="517.23"/>
      <use style="--d:24ms" href="#barR" x="424.95" y="541.17"/>
    </g>
    
    <line x1="342.03" y1="495.74" x2="350.29" y2="498.46" stroke="#000" stroke-width="2"/>
    <line x1="335.16" y1="507.69" x2="343.42" y2="510.41" stroke="#000" stroke-width="2"/>
    <line x1="442.47" y1="528.83" x2="450.73" y2="531.55" stroke="#000" stroke-width="2"/>
    <line x1="435.08" y1="540.61" x2="443.35" y2="543.33" stroke="#000" stroke-width="2"/>
  </svg>
  <div class="chargelayer"><div class="abs gline"></div><div class="tk t1"></div><div class="tk t2"></div><div class="tk b1"></div><div class="tk b2"></div></div><div class="gradbar"></div>

  <div class="abs glow jpL">活動限界まで</div>
  <div class="abs glow enL">ACTIVE TIME REMAINING:</div>
  <div class="abs glow atoL">あと</div>
  <div class="abs seg-wrap idle" id="segWrap"><div class="clock-dig" id="clockDig"></div></div>

  <div class="sep" style="top:172px;--d:380ms"><i class="l"></i><i class="r"></i></div>
  <div class="box mode inactive dead" id="modeInternal" role="button" tabindex="0"><div class="jp">内部</div><div class="en">INTERNAL</div></div>
  <div class="sep" style="top:266px;--d:340ms"><i class="l"></i><i class="r"></i></div>
  <div class="box powerbox off" id="powerBox" role="button" tabindex="0"><div class="jp">主電源供給システム</div><div class="en">MAIN ENERGY SUPPLY SYSTEM</div></div>
  <div class="sep" style="top:318px;--d:300ms"><i class="l"></i><i class="r"></i></div>
  <div class="box mode inactive dead" id="modeExternal" role="button" tabindex="0"><div class="jp">外部</div><div class="en">EXTERNAL</div></div>
  <div class="sep sm" style="top:413px;--d:260ms"><i class="l"></i><i class="r"></i></div>

  <div class="cell" data-bar="0" style="left:628px"  role="button" tabindex="0"><span class="txt">STOP</span><div class="redbar"></div></div>
  <div class="cell" data-bar="1" style="left:768px"  role="button" tabindex="0"><span class="txt">SLOW</span><div class="redbar"></div></div>
  <div class="cell" data-bar="2" style="left:908px"  role="button" tabindex="0"><span class="txt">NORMAL</span><div class="redbar"></div></div>
  <div class="cell" data-bar="3" style="left:1048px" role="button" tabindex="0"><span class="txt">RACING</span><div class="redbar"></div></div>
  <div class="danger-cell" id="dangerCell"><div class="dstk">
    <div><span>D</span><span>A</span><span>N</span><span>G</span><span>E</span><span>R</span></div>
    <div><span>E</span><span>M</span><span>E</span><span>R</span><span>G</span><span>E</span><span>N</span><span>C</span><span>Y</span></div>
  </div></div>
  <div class="subbox"><div class="stack">
    <div class="jp"><span>登</span><span>録</span><span>す</span><span>る</span></div>
    <div class="en1"><span>S</span><span>U</span><span>B</span><span>S</span><span>C</span><span>R</span><span>I</span><span>B</span><span>E</span></div>
    <div class="en2"><span>C</span><span>o</span><span>d</span><span>e</span><span>.</span><span>V</span><span>i</span><span>l</span><span>l</span><span>k</span><span>i</span><span>s</span><span>s</span></div>
  </div></div>
</div></div>
<p class="hint">「主電源供給システム」断电重启 · 「内部 / 外部」切换供电模式 · 「活動限界まで」左侧小方块循环切换 [倒计时 / 24H / 12H ]时钟</p>
<script>
(function(){
'use strict';


const NS='http://www.w3.org/2000/svg';
const body=document.body;
const panel=document.getElementById('panel');
const segWrap=document.getElementById('segWrap');
const clockDig=document.getElementById('clockDig');
const powerBox=document.getElementById('powerBox');
const modeInt=document.getElementById('modeInternal');
const modeExt=document.getElementById('modeExternal');
const dangerCell=document.getElementById('dangerCell');
const jpL=document.querySelector('.jpL');
const enL=document.querySelector('.enL');
const atoL=document.querySelector('.atoL');
const clockHot=document.getElementById('clockHot');            /* 标题左侧小方块：三态视图切换 */
const bars=[...document.querySelectorAll('.cell[data-bar]')].map(cell=>({cell,bar:cell.querySelector('.redbar')}));

/* ===================== 1. 七段数码管 ===================== */
/* 数字 → 段掩码（bit0=a … bit6=g），避免每帧做字符串 includes */
const MASK=['abcdef','bc','abged','abgcd','fgbc','afgcd','afgedc','abc','abcdefg','abfgcd'].map(s=>{
  let m=0;
  for(let i=0;i<s.length;i++) m|=1<<(s.charCodeAt(i)-97);
  return m;
});

/* 屏上 5 位：3 位大字（分 / 秒十 / 秒个）+ 2 位小字（百分秒十 / 个）
   l=left  top=顶边  w/h=尺寸  th=笔画粗细  g=段间缝隙 */
const DIGIT_SPECS=[
  {l:0,  top:0, w:117,h:229,th:26,g:4},
  {l:153,top:0, w:117,h:229,th:26,g:4},
  {l:284,top:0, w:117,h:229,th:26,g:4},
  {l:443,top:64,w:79, h:165,th:20,g:3},
  {l:538,top:64,w:79, h:165,th:20,g:3}
];
const DOT_POS=[[128,60],[128,166],[414,109],[414,177]];

/* 时钟 6 位 HH:MM:SS，沿用倒计时"大位 / 小位"的层级：时·分大，秒小
   横向 618 = 时组 206 + 冒号 36 + 分组 206 + 冒号 36 + 秒组 134
       时组 = 97 + 12 + 97        秒组 = 62 + 10 + 62
   大位 97×198（比值 0.49，与倒计时大字 117:229≈0.51 同调），纵向在 229 里居中 top 15.5
   小位 62×127（比值 0.49），与大位底部对齐 → top 15.5+198-127 = 86.5，和倒计时的百分秒一样坐基线 */
const CLOCK_SPECS=[
  {l:0,  top:15.5,w:97,h:198,th:22,g:3.5},   /* 时十 */
  {l:109,top:15.5,w:97,h:198,th:22,g:3.5},   /* 时个 */
  {l:242,top:15.5,w:97,h:198,th:22,g:3.5},   /* 分十 */
  {l:351,top:15.5,w:97,h:198,th:22,g:3.5},   /* 分个 */
  {l:484,top:86.5,w:62,h:127,th:15,g:2.5},   /* 秒十 */
  {l:556,top:86.5,w:62,h:127,th:15,g:2.5}    /* 秒个 */
];
/* 冒号柱心 224 / 466（各自所在 36px 间隔区的正中），点宽 15 → left 216.5 / 458.5
   纵向沿用倒计时冒号在字高上的比例落点（0.26 / 0.72） */
const CLOCK_DOTS=[[216.5,67],[216.5,159],[458.5,67],[458.5,159]];

/* 七段几何：中心线 + 45° 斜接，相邻段共用斜边并留等宽缝隙；返回按 a..g 索引 */
function segGeom(W,H,t,g){
  const d=g*0.7071,h=t/2,xl=h,xr=W-h,yt=h,ym=H/2,yb=H-h;
  const HZ=(x1,x2,y)=>[[x1+d,y],[x1+d+h,y-h],[x2-d-h,y-h],[x2-d,y],[x2-d-h,y+h],[x1+d+h,y+h]];
  const VT=(x,y1,y2)=>[[x,y1+d],[x+h,y1+d+h],[x+h,y2-d-h],[x,y2-d],[x-h,y2-d-h],[x-h,y1+d+h]];
  return {a:HZ(xl,xr,yt),b:VT(xr,yt,ym),c:VT(xr,ym,yb),d:HZ(xl,xr,yb),e:VT(xl,ym,yb),f:VT(xl,yt,ym),g:HZ(xl,xr,ym)};
}

/* 单个七段位；extra 用来标记所属视图（cd = 倒计时位） */
function makeDigit(spec,extra){
  const P=segGeom(spec.w,spec.h,spec.th,spec.g);
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('class','digit'+(extra?' '+extra:''));
  svg.setAttribute('viewBox',`0 0 ${spec.w} ${spec.h}`);
  svg.setAttribute('aria-hidden','true');
  svg.style.cssText=`left:${spec.l}px;top:${spec.top}px;width:${spec.w}px;height:${spec.h}px`;
  const els=new Array(7);
  for(let i=0;i<7;i++){
    const k=String.fromCharCode(97+i);
    const pg=document.createElementNS(NS,'polygon');
    pg.setAttribute('class','seg');
    pg.setAttribute('points',P[k].map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' '));
    svg.appendChild(pg);
    els[i]=pg;
  }
  /* mask 必须与真实 DOM 初始态一致（全灭 = 0），否则增量翻转会算错 */
  return {el:svg,els,mask:0};
}

/* 把一组数位 + 间隔点挂到容器上 */
function mountDigits(host,refs,dots,dotCls){
  const frag=document.createDocumentFragment();
  for(const r of refs) frag.appendChild(r.el);
  for(const [x,y] of dots){
    const el=document.createElement('i');
    el.className=dotCls;
    el.style.cssText=`left:${x}px;top:${y}px`;
    frag.appendChild(el);
  }
  host.appendChild(frag);
}

const digitRefs=DIGIT_SPECS.map(s=>makeDigit(s,'cd'));
const clockRefs=CLOCK_SPECS.map(s=>makeDigit(s,''));
mountDigits(segWrap,digitRefs,DOT_POS,'dot cd');
mountDigits(clockDig,clockRefs,CLOCK_DOTS,'dot');

/* 只翻转真正变化的段：某位掩码未变则完全不碰 DOM（分钟位一秒才变一次） */
function flip(refs,i,m){
  const r=refs[i];
  if(r.mask===m) return;
  const diff=r.mask^m;
  r.mask=m;
  for(let b=0;b<7;b++) if((diff>>b)&1) r.els[b].classList.toggle('on',!!((m>>b)&1));
}

/* 倒计时：直接由毫秒数算位，不再走"拼字符串 → 再拆字符" */
function paint(ms){
  const cs=Math.floor((ms>0?ms:0)/10);       /* 百分秒 */
  const sec=Math.floor(cs/100)%60;
  flip(digitRefs,0,MASK[Math.min(Math.floor(cs/6000),9)]);   /* 分（≤9） */
  flip(digitRefs,1,MASK[(sec/10)|0]);                        /* 秒十 */
  flip(digitRefs,2,MASK[sec%10]);                            /* 秒个 */
  flip(digitRefs,3,MASK[Math.floor(cs/10)%10]);              /* 百分秒十 */
  flip(digitRefs,4,MASK[cs%10]);                             /* 百分秒个 */
}
function paintRandom(){
  for(let i=0;i<5;i++) flip(digitRefs,i,MASK[(Math.random()*10)|0]);
}

/* 时钟：HH:MM:SS；12 小时制取 1–12，AM/PM 落在「あと」的位置 */
let apText='';
function paintClock(is12){
  const d=new Date();
  let h=d.getHours();
  const ap=h<12?'AM':'PM';
  if(is12){ h%=12; if(h===0) h=12; }
  const mm=d.getMinutes(), ss=d.getSeconds();
  flip(clockRefs,0,MASK[(h/10)|0]);
  flip(clockRefs,1,MASK[h%10]);
  flip(clockRefs,2,MASK[(mm/10)|0]);
  flip(clockRefs,3,MASK[mm%10]);
  flip(clockRefs,4,MASK[(ss/10)|0]);
  flip(clockRefs,5,MASK[ss%10]);
  const t=is12?ap:'24';                      /* 24 小时制时该位置显示 24 */
  if(t!==apText){ apText=t; atoL.textContent=t; }
}

/* ===================== 2. 状态与倒计时 ===================== */
const DURATION=5*60*1000;   /* 恰好 5 分钟 */
const DANGER_AT=7000;       /* 最后 7 秒变色 */
const SCRAMBLE_MS=400, SCRAMBLE_HOLD=75, HOLD_MS=700;

/* 唯一真相源：powered / internal / zero / view。
   交互只改这四个变量，再由 render() 推导出全部 DOM；不再从 class 反读状态。 */
let powered=false, internal=false, zero=false, view=0;
let remain=DURATION, endAt=0, danger=false, running=false, frozen=false;
let rafLoop=0, rafScramble=0, holdTimer=0, clockTimer=0;

/* 自适应缩放：rAF 合并同一帧内的多次 resize */
let fitQueued=false;
function fit(){
  fitQueued=false;
  const s=Math.min(innerWidth/1300,(innerHeight-28)/600);
  panel.style.transform=`translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize',()=>{
  if(fitQueued) return;
  fitQueued=true;
  requestAnimationFrame(fit);
},{passive:true});

/* 最后 7 秒警戒：缓存状态，避免每帧都调 classList。
   警戒色只在倒计时视图落地 —— 时钟视图没有剩余时间可言，不该被染红。 */
function applyDanger(){
  body.classList.toggle('danger',danger&&view===0);
}
function setDanger(on){
  if(danger===on) return;
  danger=on;
  applyDanger();
}

/* 主循环：以"截止时刻"为基准，避免逐帧累加造成的漂移 */
function loop(now){
  if(!running) return;                /* 防住停表后残留的一帧 */
  remain=endAt-now;
  if(remain<0) remain=0;
  paint(remain);
  setDanger(remain<=DANGER_AT);
  if(remain===0){ trip(); return; }
  rafLoop=requestAnimationFrame(loop);
}

/* 活動限界到達：停表并置 zero，视觉（闪烁 / 只留 STOP）由 render() 统一落地 */
function trip(){
  running=false;
  rafLoop=0;
  zero=true;
  render();
}

/* 切到内部：数码管乱码 0.4s → 定格 5:00.00 停 0.7s → 开始倒计时 */
function startTimer(){
  stopTimer();
  remain=DURATION;
  running=true;               /* 先置位，防外部重复触发 */
  setDanger(false);           /* 全新一轮从 5:00 起，不能带着上一轮的警戒色 */
  paintRandom();
  const t0=performance.now();
  let due=SCRAMBLE_HOLD;
  const step=()=>{
    const e=performance.now()-t0;
    if(e>=SCRAMBLE_MS){
      rafScramble=0;
      paint(DURATION);        /* 定格 5:00.00，停 HOLD_MS 供看清 */
      holdTimer=setTimeout(()=>{
        holdTimer=0;
        endAt=performance.now()+remain;
        rafLoop=requestAnimationFrame(loop);
      },HOLD_MS);
      return;
    }
    if(e>=due){ paintRandom(); due+=SCRAMBLE_HOLD; }
    rafScramble=requestAnimationFrame(step);
  };
  rafScramble=requestAnimationFrame(step);
}

function stopTimer(){
  running=false; frozen=false;
  if(rafLoop){cancelAnimationFrame(rafLoop);rafLoop=0;}
  if(rafScramble){cancelAnimationFrame(rafScramble);rafScramble=0;}
  if(holdTimer){clearTimeout(holdTimer);holdTimer=0;}
}

/* 切到时钟视图：停表并保住剩余时间，切回来从原处接着走。
   rafLoop 非空才说明真正在走（此时 endAt 有效）；若还停在乱码 / 定格阶段，
   remain 仍是 5:00，切回来直接开始走。 */
function freezeTimer(){
  if(!running) return;
  if(rafLoop) remain=Math.max(0,endAt-performance.now());
  stopTimer();
  frozen=true;
}
function resumeTimer(){
  endAt=performance.now()+remain;
  running=true; frozen=false;
  setDanger(remain<=DANGER_AT);
  rafLoop=requestAnimationFrame(loop);
}

/* 倒计时的目标态由 (powered, internal, zero, view) 推出，幂等可反复调用 */
function syncCountdown(){
  if(!powered||!internal||zero){
    stopTimer();
    /* 归零保持 0:00.00 与警戒色；其余终止路径回到待机定格 5:00.00 */
    if(!zero){ setDanger(false); remain=DURATION; paint(DURATION); }
    return;
  }
  if(view!==0) freezeTimer();
  else if(frozen) resumeTimer();
  else if(!running) startTimer();
}

/* ===================== 3. 视图三态切换 =====================
   0 倒计时 → 1 二十四小时制时钟 → 2 十二小时制时钟 → 0 …
   时钟按整秒对齐推进（不必每帧读 Date），切换瞬间立即出一帧不空屏。
   切到时钟视图会冻结倒计时（进度保留），切回倒计时视图接着走。 */
const TITLE_JP=['活動限界まで','現在の時間は'];
const TITLE_EN=['ACTIVE TIME REMAINING:','CURRENT TIME COUNTING:'];

function startClock(){
  if(clockTimer) return;
  const step=()=>{
    clockTimer=0;
    if(view===0) return;
    paintClock(view===2);
    clockTimer=setTimeout(step,1000-(Date.now()%1000)+10);   /* 对齐到下一个整秒 */
  };
  step();
}
function stopClock(){
  if(clockTimer){clearTimeout(clockTimer);clockTimer=0;}
  apText='';
}

/* 红色长条：同一时间只亮一个；hideRest=true 时其余按钮整体隐藏（归零态） */
function setBars(index,hideRest){
  for(let k=0;k<bars.length;k++){
    bars[k].bar.classList.toggle('on',k===index);
    bars[k].cell.classList.toggle('gone',!!hideRest&&k!==index);
  }
}

/* 视图切换的过渡：只让标题与数码管淡入一次（一次性重排，不是每个元素各排一次） */
const fadeEls=[jpL,enL,atoL,segWrap];
function crossFade(){
  for(const el of fadeEls) el.classList.remove('vswap');
  void panel.offsetWidth;
  for(const el of fadeEls) el.classList.add('vswap');
}

/* 唯一的渲染入口：把四个状态变量推导成全部 DOM。幂等 ——
   同一状态调两次结果一致，所以任何交互都可以无脑调它，不必关心上一步是什么。 */
function render(){
  const clk=view!==0, int=powered&&internal;
  body.classList.toggle('pw',powered);           /* 通电→装甲充能（左下→右上充满） */
  body.classList.toggle('clk',clk);
  body.classList.toggle('zero',zero);
  applyDanger();                                 /* 切到时钟视图时把警戒色摘掉，切回去再恢复 */
  jpL.textContent=TITLE_JP[clk?1:0];
  enL.textContent=TITLE_EN[clk?1:0];
  for(const [el,on] of [[modeExt,powered&&!internal],[modeInt,int]]){
    el.classList.toggle('active',on);
    el.classList.toggle('inactive',!on);
    el.classList.toggle('dead',!powered);        /* 未通电：内外部连边框一起不显示 */
    el.tabIndex=powered?0:-1;                    /* 不可见时移出 Tab 序列 */
  }
  segWrap.classList.toggle('idle',!clk&&!int);   /* idle 只压倒计时位（CSS 已收窄到 .cd） */
  dangerCell.classList.toggle('on',int&&!clk);
  powerBox.classList.toggle('off',!powered);
  /* 关：全灭；归零：只留 STOP；内部：RACING；外部：NORMAL */
  const zeroLook=zero&&!clk;
  setBars(!powered?-1:(zeroLook?0:(internal?3:2)),zeroLook);
  if(clk){
    apText='';
    paintClock(view===2);      /* 24H↔12H 互切时立即重画，不等下一整秒 */
    /* 未通电屏幕是灭的：只画这一帧（把 24 / AM·PM 标记摆对），不点秒表 */
    if(powered) startClock(); else stopClock();
  }else{
    atoL.textContent='あと';
    stopClock();
  }
  syncCountdown();          /* 两个视图都要对齐：时钟视图冻结，倒计时视图启动或恢复 */
}

/* 点击 + 键盘（Enter / Space）统一激活 */
function onActivate(el,fn){
  el.addEventListener('click',fn);
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(e);}
  });
}

/* 通电瞬间：STOP→SLOW→NORMAL 逐个点亮，最终停在 NORMAL（≈0.5s，与背景充能同步）。
   不记 timer 句柄、不设 in-flight 标志：点亮前复查"仍是通电且外部"即可让过期序列自然失效，
   所以断电 / 立刻切内部都不必回头取消定时器。 */
function powerSeq(){
  setBars(-1);
  [120,220,320].forEach((ms,k)=>setTimeout(()=>{
    if(powered&&!internal&&!zero) setBars(k);
  },ms));
}

onActivate(powerBox,()=>{
  powered=!powered;
  internal=false;
  zero=false;
  view=0;                   /* 开与关都回到倒计时视图：断电时的待机表不能带进新一轮 */
  render();
  if(powered) powerSeq();   /* 必须在 render 之后：先把红条归零，再由序列逐个点亮 */
});
/* 归零态也响应：一次点击直接重开一轮 5:00.00 */
onActivate(modeInt,()=>{ if(powered&&(zero||!internal)){ internal=true; zero=false; render(); } });
onActivate(modeExt,()=>{ if(powered&&internal){ internal=false; zero=false; render(); } });

/* 标题左侧小方块：倒计时 → 24H → 12H → 倒计时 …
   断电也能切（相当于待机表）；切换用淡入而不是整屏闪光 */
onActivate(clockHot,()=>{
  view=(view+1)%3;
  render();
  crossFade();
});

bars.forEach(({cell},i)=>onActivate(cell,()=>{
  if(!powered||zero) return;
  setBars(i);
}));

/* 初始化：打开网页即自动接通主電源供給システム。 */
